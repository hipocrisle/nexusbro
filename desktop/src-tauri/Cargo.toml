[package]
name = "nexusbro"
version = "0.2.4"
description = "NexusBro — браузер с супер-вкладками поверх ungoogled-chromium"
authors = ["hipogas"]
edition = "2021"

[lib]
name = "nexusbro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "process"] }
# CEF — движок рождается дочерним окном в нашем (ветка cef-migration).
# Файлы движка: CEF_PATH на дев-машине или рядом с exe в сборке.
cef = { version = "156.4", default-features = false }

# Встраивание чужого окна — у каждой системы свой приём.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["allow-unsafe-code"] }
# Нужен, чтобы получить X11-указатель нашего окна у Tauri.
gtk = "0.18"
gdkx11 = "0.18"
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_Graphics_Gdi",
  "Win32_System_JobObjects",
  # ⛔ Без Win32_Security функция CreateJobObjectW просто НЕ видна:
  # она спрятана за этим признаком (ей нужен SECURITY_ATTRIBUTES).
  "Win32_Security",
  # AttachThreadInput: без него встроенное чужое окно не получает клавиатуру.
  "Win32_UI_Input_KeyboardAndMouse",
]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
