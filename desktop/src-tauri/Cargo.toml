[package]
name = "nexusbro"
version = "0.1.0"
description = "NexusBro — браузер с супер-вкладками поверх ungoogled-chromium"
authors = ["hipogas"]
edition = "2021"

[lib]
name = "nexusbro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "5"

# Встраивание чужого окна — у каждой системы свой приём.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["allow-unsafe-code"] }
# Нужен, чтобы получить X11-указатель нашего окна у Tauri.
gtk = "0.18"
gdkx11 = "0.18"
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  "Win32_Graphics_Gdi",
  "Win32_System_JobObjects",
]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
