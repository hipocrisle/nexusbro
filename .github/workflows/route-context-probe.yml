name: CEF route context capability (offline, no release)
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  capability:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CEF_VERSION: "156.0.26+g8ea0c73+chromium-156.0.8078.88"
      CEF_BASE: "cef_binary_156.0.26+g8ea0c73+chromium-156.0.8078.88"
      CEF_SHA1: "cacfbb7d7261fea682fb67c108de7e4347519ff7"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Identify compiler image
        id: image
        run: echo "key=${ImageOS:-$RUNNER_OS}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: cargo-cache
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            tests/route_context_probe/target/
          key: ${{ runner.os }}-route-probe-${{ steps.image.outputs.key }}-${{ hashFiles('tests/route_context_probe/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-route-probe-${{ steps.image.outputs.key }}-
      - name: Check preinstalled offline probe tools
        run: |
          set -euo pipefail
          command -v Xvfb
          command -v ip
          command -v unshare
      - uses: actions/cache/restore@v4
        id: cef
        with:
          path: desktop/src-tauri/cef
          key: cef-${{ env.CEF_VERSION }}-${{ runner.os }}
      - name: Verified CEF SDK
        if: steps.cef.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fSL --max-time 180 --retry 2 -o /tmp/cef-probe.tar.bz2 "https://cef-builds.spotifycdn.com/${CEF_BASE}_linux64_minimal.tar.bz2"
          echo "$CEF_SHA1 /tmp/cef-probe.tar.bz2" | sha1sum -c -
          mkdir -p desktop/src-tauri/cef
          tar -xjf /tmp/cef-probe.tar.bz2 -C desktop/src-tauri/cef --strip-components=1
          mv desktop/src-tauri/cef/Release/* desktop/src-tauri/cef/
          mv desktop/src-tauri/cef/Resources/* desktop/src-tauri/cef/
          rm -rf desktop/src-tauri/cef/Release desktop/src-tauri/cef/Resources
          printf '{"type":"minimal","name":"%s","sha1":"%s"}' "${CEF_BASE}_linux64_minimal.tar.bz2" "$CEF_SHA1" > desktop/src-tauri/cef/archive.json
      - uses: actions/cache/save@v4
        if: steps.cef.outputs.cache-hit != 'true'
        with:
          path: desktop/src-tauri/cef
          key: cef-${{ env.CEF_VERSION }}-${{ runner.os }}
      - name: Build only synthetic capability executable
        run: |
          set -euo pipefail
          export CEF_PATH="$GITHUB_WORKSPACE/desktop/src-tauri/cef"
          cargo build --release --locked --manifest-path tests/route_context_probe/Cargo.toml --target x86_64-unknown-linux-gnu --bin route_context_probe
          ldd "$CEF_PATH/libcef.so" > /tmp/route-probe-runtime-libs
          if grep -q "not found" /tmp/route-probe-runtime-libs; then cat /tmp/route-probe-runtime-libs; exit 1; fi
      - name: Save probe compiler cache even after a diagnostic compile failure
        if: always() && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            tests/route_context_probe/target/
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      - name: Measure contexts with physically isolated loopback networking
        timeout-minutes: 5
        run: |
          set -euo pipefail
          sudo unshare --net -- bash -c '
            set -euo pipefail
            ip link set lo up
            exec env CEF_PATH="$1" LD_LIBRARY_PATH="$1" python3 tests/gui/route_context_probe.py --exe "$2" --out "$3"
          ' route-probe "$GITHUB_WORKSPACE/desktop/src-tauri/cef" "$GITHUB_WORKSPACE/tests/route_context_probe/target/x86_64-unknown-linux-gnu/release/route_context_probe" "$GITHUB_WORKSPACE/.dev-check/route-probe"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: route-context-capability
          path: .dev-check/route-probe/
          retention-days: 7
