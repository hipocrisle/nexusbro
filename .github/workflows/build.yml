name: Build NexusBro

on:
  push:
    branches: [main, cef-migration]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      youtube_deno_cache_probe:
        description: Observe Deno cache fallback on disposable unprivileged runner
        type: boolean
        default: false
      youtube_consumer_package:
        description: Prepare sealed opt-in consumer probe without media request
        type: boolean
        default: false
      youtube_sources_inventory:
        description: Collect pinned source/notices evidence without desktop publication
        type: boolean
        default: false
      youtube_muxer_reuse:
        description: Reviewed immutable minimal muxer run to verify without rebuilding
        type: string
        default: ""
      youtube_native_reuse:
        description: JSON run/source for diagnostic native YouTube tests using an existing Windows package (never acceptance)
        type: string
        default: ""
      youtube_muxer_only:
        description: Verify minimal source-built local muxer prototype without desktop publication
        type: boolean
        default: false
      youtube_probe_diagnostic_key:
        description: Optional public encryption key for private extractor diagnosis (never a private key)
        type: string
        default: ""
      youtube_probe_only:
        description: Verify real anonymous packaged YouTube extraction without publication
        type: boolean
        default: false
      linux_build_only:
        description: Build and verify Linux only while debugging native integration (no release)
        type: boolean
        default: false
      frontend_only:
        description: Build frontend and isolated security tests (no CEF)
        type: boolean
        default: false
      linux_memory_diagnostic:
        description: Inspect native early-memory installation only (never security acceptance or publication)
        type: boolean
        default: false
      runtime_memory_only:
        description: Run only native memory integration from an existing matching Windows package (never publish)
        type: boolean
        default: false
      performance_build:
        description: Measure Windows CPU and memory using packages from this run (no build or publication)
        required: false
        default: ""
      resource_soak:
        description: Optional JSON resource experiment specification (never publication)
        required: false
        default: ""
      performance_visibility:
        description: Probe actual page visibility and animation callbacks (different workload)
        type: boolean
        default: false
      performance_expect_throttled:
        description: Require hidden background pages, paused animation frames and restored paint/input
        type: boolean
        default: false
      performance_native_diagnostic:
        description: Diagnostic external Widget hide/restore (never product acceptance)
        type: boolean
        default: false
      performance_reference:
        description: Optional reference package run to measure first on the same Windows VM
        required: false
        default: ""
      performance_saved_tabs:
        description: Saved tabs per Super in the measurement
        required: false
        default: "6"
      performance_supers:
        description: Number of real Supers in the measurement (1-12)
        required: false
        default: "4"
      performance_live_tabs:
        description: Tabs actually visited per Super in the measurement (1-12)
        required: false
        default: "6"
      runtime_build:
        description: Run only Windows screen test from an existing build run (empty = build)
        required: false
        default: ""
      linux_runtime_build:
        description: Repeat native Linux security tests from an existing matching app build
        required: false
        default: ""
      publish_tag:
        description: Publish existing tagged packages after successful runtime check (requires runtime_build)
        required: false
        default: ""
      runtime_baseline:
        description: Existing package predates NEXUSBRO_TEST_DATA (ephemeral runner only)
        type: boolean
        required: false
        default: false

jobs:
  youtube-native-reuse:
    if: github.event_name == 'workflow_dispatch' && inputs.youtube_native_reuse != ''
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/youtube-native-reuse.yml
    with:
      run: ${{ fromJSON(inputs.youtube_native_reuse).run }}
      source: ${{ fromJSON(inputs.youtube_native_reuse).source }}
      layout_only: ${{ fromJSON(inputs.youtube_native_reuse).layout_only || false }}
      platform: ${{ fromJSON(inputs.youtube_native_reuse).platform || 'both' }}
      paired_config: ${{ fromJSON(inputs.youtube_native_reuse).paired && toJSON(fromJSON(inputs.youtube_native_reuse).paired) || '' }}
  youtube-deno-cache-probe:
    if: inputs.youtube_deno_cache_probe
    uses: ./.github/workflows/deno-cache-probe.yml
  youtube-consumer-package:
    if: inputs.youtube_consumer_package
    uses: ./.github/workflows/youtube-consumer-package.yml
  youtube-components-probe:
    if: inputs.youtube_probe_only
    uses: ./.github/workflows/youtube-probe.yml
    with:
      diagnostic_public_key: ${{ inputs.youtube_probe_diagnostic_key }}
      impersonate_chrome: false
  process-ownership:
    if: >-
      inputs.youtube_native_reuse == '' && (!(inputs.frontend_only && (inputs.youtube_muxer_only || inputs.youtube_sources_inventory) && !inputs.youtube_probe_only) && !inputs.runtime_build && !inputs.linux_runtime_build && !inputs.performance_build && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository))
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Prove profile exclusion and actual owned descendant exit
        run: cargo test --manifest-path tests/super_process_harness/Cargo.toml -- --test-threads=1
  youtube-sources:
    if: >-
      inputs.youtube_native_reuse == '' && (inputs.youtube_sources_inventory || (!inputs.frontend_only && !inputs.runtime_build && !inputs.linux_runtime_build && !inputs.performance_build && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)))
    uses: ./.github/workflows/youtube-sources.yml
  youtube-minimal-muxer:
    if: >-
      inputs.youtube_native_reuse == '' && ((inputs.youtube_muxer_only && inputs.youtube_muxer_reuse == '') || (!inputs.frontend_only && !inputs.runtime_build && !inputs.linux_runtime_build && !inputs.performance_build && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)))
    needs: [youtube-media-fixture]
    uses: ./.github/workflows/youtube-muxer.yml
    with:
      source_sha256: ce3fa044e0dd97ac7a2e7af710056daa850464ec11bdf804a8033c5eae1ec706
  youtube-muxer-reuse:
    if: inputs.youtube_muxer_only && inputs.youtube_muxer_reuse != ''
    needs: [youtube-media-fixture]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/youtube-muxer-reuse.yml
    with:
      source_run: ${{ inputs.youtube_muxer_reuse }}
  security:
    if: >-
      inputs.youtube_native_reuse == '' && (!(inputs.frontend_only && (inputs.youtube_muxer_only || inputs.youtube_sources_inventory) && !inputs.youtube_probe_only) && !inputs.runtime_build && !inputs.linux_runtime_build && !inputs.performance_build && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test encrypted vault and independent account server
        run: |
          cargo test --manifest-path tests/security_vault_harness/Cargo.toml
          cargo test --manifest-path tests/session_recovery_harness/Cargo.toml
          cargo test --manifest-path tests/sync_history_harness/Cargo.toml
          cargo test --manifest-path tests/browser_tasks_harness/Cargo.toml
          cargo test --manifest-path tests/browser_lock_intent_harness/Cargo.toml
          cargo test --manifest-path tests/youtube_light_harness/Cargo.toml
          cargo test --manifest-path tests/tab_route_contracts/Cargo.toml
          cargo test --manifest-path tests/super_lifecycle_harness/Cargo.toml
          cargo test --manifest-path tests/super_cookie_harness/Cargo.toml
          cargo test --manifest-path sync-server/Cargo.toml
          cargo build --release --locked --manifest-path sync-server/Cargo.toml
          cargo build --release --locked --manifest-path sync-server/Cargo.toml --example live_acceptance
          mkdir -p .dev-check/backend-package
          cp sync-server/target/release/nexusbro-sync-server .dev-check/backend-package/
          cp sync-server/target/release/examples/live_acceptance .dev-check/backend-package/
          cp sync-server/README.md .dev-check/backend-package/
          cp -r sync-server/deploy .dev-check/backend-package/
          cd .dev-check/backend-package
          sha256sum nexusbro-sync-server live_acceptance > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: nexusbro-sync-backend
          path: .dev-check/backend-package/
          retention-days: 14
  frontend:
    if: >-
      inputs.youtube_native_reuse == '' && (github.event_name == 'workflow_dispatch' && inputs.frontend_only && !(inputs.youtube_muxer_only || inputs.youtube_sources_inventory))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci && npm run build
        working-directory: desktop
      - run: node --test tests/updater_visibility.cjs
      - run: python3 tests/release_acceptance_test.py
      - run: |
          python3 -m pip install --break-system-packages playwright
          python3 tests/frontend_controls.py
          python3 tests/browser_ui_0213.py
          python3 tests/address_selection.py
          git fetch --no-tags --depth=1 origin 097a6595440609f1a060bd5a9de2d6c51d40bfe6
          node tests/reklama_stranicy.js
          python3 tests/adblock_performance.py
          python3 tests/translation_dom.py
          python3 tests/library_state_0214.py
          python3 tests/super_colors_0214.py
          python3 tests/address_autocomplete_0214.py
          python3 tests/security_ui_browser.py
          python3 tests/browser_lock_race_browser.py
          python3 tests/vault_recovery_browser.py
          python3 tests/cloud_supers.py
          python3 tests/memory_safety_browser.py
          python3 tests/memory_bootstrap_browser.py
  youtube-media-fixture:
    if: >-
      inputs.youtube_native_reuse == '' && ((inputs.youtube_muxer_only || (!inputs.frontend_only && !inputs.runtime_build && !inputs.linux_runtime_build && !inputs.performance_build)) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Generate controlled real VP9 and Opus streams (runner only)
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          mkdir -p .dev-check/youtube-media-fixture
          ffmpeg -hide_banner -loglevel error -f lavfi -i 'testsrc2=size=320x180:rate=12' -t 120 -an -c:v libvpx-vp9 -deadline realtime -cpu-used 8 -threads 1 -b:v 180k -y .dev-check/youtube-media-fixture/video.webm
          ffmpeg -hide_banner -loglevel error -f lavfi -i 'sine=frequency=440:sample_rate=48000' -t 120 -af volume=0.05 -vn -c:a libopus -b:a 32k -y .dev-check/youtube-media-fixture/audio.webm
          ffmpeg -hide_banner -loglevel error -f lavfi -i 'testsrc2=size=640x360:rate=12' -t 120 -an -c:v libvpx-vp9 -deadline realtime -cpu-used 8 -threads 1 -b:v 350k -y .dev-check/youtube-media-fixture/video-high.webm
          sha256sum .dev-check/youtube-media-fixture/*.webm > .dev-check/youtube-media-fixture/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: youtube-controlled-media
          path: .dev-check/youtube-media-fixture/
          retention-days: 7

  build:
    needs: [security, process-ownership, youtube-media-fixture, youtube-minimal-muxer, youtube-sources]
    # ⛔ Не запускать сборку для запросов из ЧУЖИХ копий репозитория: она
    # выполняет их же скрипты. Свои ветки и запросы собираются как обычно.
    if: >-
      inputs.youtube_native_reuse == '' && (!inputs.frontend_only && !inputs.runtime_build && !inputs.linux_runtime_build && !inputs.performance_build && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository))
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.linux_build_only && '[{"os":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu","artifact":"nexusbro-linux"}]' || '[{"os":"windows-latest","target":"x86_64-pc-windows-msvc","artifact":"nexusbro-windows"},{"os":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu","artifact":"nexusbro-linux"}]') }}

    runs-on: ${{ matrix.os }}
    timeout-minutes: 80
    permissions:
      contents: write
    env:
      # CEF 156.0.26 — ровно тот, что ждёт crate cef = 156.4.
      CEF_VERSION: "156.0.26+g8ea0c73+chromium-156.0.8078.88"
      CEF_BASE: "cef_binary_156.0.26+g8ea0c73+chromium-156.0.8078.88"
      CEF_SHA1_LINUX: cacfbb7d7261fea682fb67c108de7e4347519ff7
      CEF_SHA1_WINDOWS: 15d29eea209d857c22dc163706080295aea69b5c

    steps:
      - uses: actions/checkout@v4

      - name: Refuse publication from a Linux-only diagnostic
        if: inputs.linux_build_only
        env:
          DIAGNOSTIC_PUBLISH_TAG: ${{ inputs.publish_tag }}
        run: |
          test "$GITHUB_REF_TYPE" != tag
          test -z "$DIAGNOSTIC_PUBLISH_TAG"

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ⛔ Версия в настройках должна совпадать с меткой ДО выпуска, иначе
      # обновлятор зациклится. Проверяем сразу и падаем.
      - name: Сверить метку с версией
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: desktop
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          CONF_VER=$(node -p "require('./src-tauri/tauri.conf.json').version")
          PKG_VER=$(node -p "require('./package.json').version")
          echo "метка=$TAG_VER  tauri.conf.json=$CONF_VER  package.json=$PKG_VER"
          [ "$CONF_VER" = "$TAG_VER" ] || { echo "::error::версия в tauri.conf.json ($CONF_VER) ≠ метке"; exit 1; }
          [ "$PKG_VER" = "$TAG_VER" ]  || { echo "::error::версия в package.json ($PKG_VER) ≠ метке"; exit 1; }

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Identify runner image for the native compiler cache
        id: build_image
        shell: bash
        run: echo "key=${ImageOS:-$RUNNER_OS}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Запомнить сборочный кэш
        id: rust_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            desktop/src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ steps.build_image.outputs.key }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-${{ steps.build_image.outputs.key }}-

      - name: Зависимости Linux
        timeout-minutes: 12
        if: matrix.os == 'ubuntu-24.04'
        run: |
          # Hosted Ubuntu images select package mirrors through these files.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          if [ -f /etc/apt/apt-security-mirrors.txt ]; then
            printf '%s\n' 'https://security.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-security-mirrors.txt >/dev/null
          fi
          # Regional EC2 mirrors stalled small packages for many minutes.
          # Runner-only change; package signatures remain enforced by apt.
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i -E -e 's@https?://([a-z0-9.-]+\.)?archive\.ubuntu\.com/ubuntu/?@https://archive.ubuntu.com/ubuntu/@g' -e 's@http://security\.ubuntu\.com/ubuntu/?@https://security.ubuntu.com/ubuntu/@g' /etc/apt/sources.list.d/ubuntu.sources
          fi
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev pkg-config \
            libxcb1-dev patchelf rpm libarchive-tools cpio xvfb xdotool xclip x11-utils openbox wmctrl libnss3-tools

      # Движок CEF кладём внутрь установщика (замена ungoogled-chromium,
      # ветка cef-migration). Архивные файлы лежат в Release/ и Resources/ —
      # выравниваем в корень cef/, оттуда tauri.conf.json кладёт их рядом
      # с exe. Кэш по версии CEF: не качаем 300 МБ на каждый прогон.
      - name: Кэш CEF
        id: kef
        uses: actions/cache@v4
        with:
          path: desktop/src-tauri/cef
          key: cef-${{ env.CEF_VERSION }}-${{ runner.os }}

      - name: Положить CEF внутрь
        if: steps.kef.outputs.cache-hit != 'true'
        shell: bash
        working-directory: desktop/src-tauri
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            x86_64-pc-windows-msvc) PLAT=windows64; SHA=$CEF_SHA1_WINDOWS;;
            x86_64-unknown-linux-gnu) PLAT=linux64;   SHA=$CEF_SHA1_LINUX;;
            *) echo "::error::нет CEF под ${{ matrix.target }}"; exit 1;;
          esac
          curl -fSL --retry 3 -o /tmp/cef.tar.bz2             "https://cef-builds.spotifycdn.com/${CEF_BASE}_${PLAT}_minimal.tar.bz2"
          echo "$SHA /tmp/cef.tar.bz2" | sha1sum -c -
          mkdir -p cef
          tar -xjf /tmp/cef.tar.bz2 -C cef --strip-components=1
          mv cef/Release/* cef/ 2>/dev/null || true
          mv cef/Resources/* cef/ 2>/dev/null || true
          rm -rf cef/Release cef/Resources
          # cef-dll-sys валидирует CEF_PATH по archive.json — пишем его.
          printf '{"type":"minimal","name":"%s","sha1":"%s"}' \
            "${CEF_BASE}_${PLAT}_minimal.tar.bz2" "$SHA" > cef/archive.json
          test -f cef/libcef.dll || test -f cef/libcef.so || { echo "::error::libcef не нашёлся после распаковки"; exit 1; }
          test -f cef/locales/en-US.pak || { echo "::error::в CEF нет locales/en-US.pak"; exit 1; }
          du -sh cef

      - name: Путь к CEF для сборки
        shell: bash
        run: echo "CEF_PATH=$GITHUB_WORKSPACE/desktop/src-tauri/cef" >> "$GITHUB_ENV"

      # Движок туннеля — только движок. ⛔ Никаких наших узлов, ключей и
      # подписок: человек вставляет своё.
      - name: Положить xray внутрь
        shell: bash
        working-directory: desktop/src-tauri
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            x86_64-pc-windows-msvc)   ASSET=Xray-windows-64.zip; BIN=xray.exe;;
            x86_64-unknown-linux-gnu) ASSET=Xray-linux-64.zip;   BIN=xray;;
            *) echo "::error::нет xray под ${{ matrix.target }}"; exit 1;;
          esac
          curl -fSL --retry 3 -o xray.zip \
            "https://github.com/XTLS/Xray-core/releases/latest/download/$ASSET"
          mkdir -p binaries
          unzip -o -q xray.zip "$BIN" geoip.dat geosite.dat -d binaries
          test -s binaries/geoip.dat
          test -s binaries/geosite.dat
          rm -f xray.zip
          chmod +x "binaries/$BIN" || true
          test -s "binaries/$BIN"
          ls -lh binaries
          python ../../tests/xray_assets.py --bin "binaries/$BIN"

      - name: Download same-run verified minimal muxer
        uses: actions/download-artifact@v4
        with:
          name: youtube-minimal-muxer-${{ runner.os == 'Windows' && 'windows-x64' || 'linux-x64' }}
          path: .dev-check/minimal-muxer

      - name: Download same-run verified source notice inventory
        uses: actions/download-artifact@v4
        with:
          name: youtube-source-inventory
          path: .dev-check/source-notices

      - name: Package verified YouTube helpers and notices
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            x86_64-pc-windows-msvc) PLATFORM=windows-x64;;
            x86_64-unknown-linux-gnu) PLATFORM=linux-x64;;
            *) exit 1;;
          esac
          set -euo pipefail
          MUXER_PACKAGE=.dev-check/minimal-muxer/.dev-check/muxer-build/package
          test -s "$MUXER_PACKAGE/components.json"
          python tools/package_youtube_components.py --platform "$PLATFORM" --muxer-package "$MUXER_PACKAGE" --notices-inventory .dev-check/source-notices

      - name: Preserve verified minimal muxer source and exact recipe beyond upstream retention
        uses: actions/upload-artifact@v4
        with:
          name: youtube-component-upstream-${{ matrix.os }}
          path: |
            .dev-check/minimal-muxer/.dev-check/muxer-build/source.tar.gz
            .dev-check/minimal-muxer/.dev-check/muxer-build/source-receipt.json
            .dev-check/minimal-muxer/tools/build_youtube_muxer.py
            .dev-check/minimal-muxer/.github/workflows/youtube-muxer.yml
          retention-days: 90
          if-no-files-found: error

      - name: Поставить зависимости
        working-directory: desktop
        run: npm ci

      - name: Собрать
        id: app-build
        working-directory: desktop
        shell: bash
        env:
          # Подпись артефактов автообновления (.sig рядом с установщиками).
          # Без секрета сборка идёт, но updater'у будет нечего проверять.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          # Кэш тащит из прошлых прогонов bundle/* прошлых версий. Тогда
          # глоб nsis/*.exe ловит несколько установщиков, а 7z x с
          # несколькими файлами считает лишние фильтрами имён и молча
          # распаковывает 0 файлов. Чистим — и в артефакте/релизе всегда
          # ровно один свежий пакет.
          rm -rf "src-tauri/target/${{ matrix.target }}/release/bundle"
          npm run tauri build -- --target ${{ matrix.target }}

      - name: Verify real backup crypto and rollback filesystem
        working-directory: desktop/src-tauri
        shell: bash
        run: |
          export PATH="$CEF_PATH:$PATH"
          export LD_LIBRARY_PATH="$CEF_PATH:${LD_LIBRARY_PATH:-}"
          cargo test --release --target ${{ matrix.target }} --lib browser_backup::tests -- --test-threads=1
          cargo test --release --target ${{ matrix.target }} --lib super_hibernation_parent::tests -- --test-threads=1
          cargo test --release --target ${{ matrix.target }} --lib youtube_light::tests -- --test-threads=1
          cargo test --release --target ${{ matrix.target }} --lib youtube_light_resume::tests -- --test-threads=1
          cargo test --release --target ${{ matrix.target }} --lib youtube_light_http -- --test-threads=1
          cargo test --release --target ${{ matrix.target }} --lib youtube_light_sidecar::tests -- --test-threads=1
          cargo test --release --target ${{ matrix.target }} --lib cef_youtube::tests -- --test-threads=1
          cargo test --release --target ${{ matrix.target }} --lib cef_youtube_probe::tests -- --test-threads=1
          cargo test --release --target ${{ matrix.target }} --lib cef_youtube_reference_probe::tests -- --test-threads=1
          cargo test --release --target ${{ matrix.target }} --lib cef_youtube_decode_probe::tests -- --test-threads=1
