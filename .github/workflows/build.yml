name: Build NexusBro

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    # ⛔ Не запускать сборку для запросов из ЧУЖИХ копий репозитория: она
    # выполняет их же скрипты. Свои ветки и запросы собираются как обычно.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: nexusbro-windows
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: nexusbro-linux

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ⛔ Версия в настройках должна совпадать с меткой ДО выпуска, иначе
      # обновлятор зациклится. Проверяем сразу и падаем.
      - name: Сверить метку с версией
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: desktop
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          CONF_VER=$(node -p "require('./src-tauri/tauri.conf.json').version")
          PKG_VER=$(node -p "require('./package.json').version")
          echo "метка=$TAG_VER  tauri.conf.json=$CONF_VER  package.json=$PKG_VER"
          [ "$CONF_VER" = "$TAG_VER" ] || { echo "::error::версия в tauri.conf.json ($CONF_VER) ≠ метке"; exit 1; }
          [ "$PKG_VER" = "$TAG_VER" ]  || { echo "::error::версия в package.json ($PKG_VER) ≠ метке"; exit 1; }

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Запомнить сборочный кэш
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            desktop/src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Зависимости Linux
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev pkg-config \
            libxcb1-dev patchelf rpm

      # Движок кладём внутрь ТОЛЬКО на Windows: там его иначе негде взять.
      # На Linux берём системный ungoogled-chromium или chromium — он ставится
      # из репозитория и обновляется сам, тащить 200 МБ в пакет незачем.
      - name: Положить движок внутрь (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        working-directory: desktop/src-tauri
        run: |
          set -euo pipefail
          URL=$(curl -fsSL https://api.github.com/repos/ungoogled-software/ungoogled-chromium-windows/releases/latest \
                | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                    const a=JSON.parse(s).assets.find(x=>/windows_x64\.zip$/.test(x.name));
                    if(!a){console.error("нет сборки под windows x64");process.exit(1)}
                    console.log(a.browser_download_url)})')
          echo "качаю движок: $URL"
          curl -fSL --retry 3 -o dvizhok.zip "$URL"
          mkdir -p chromium
          unzip -q dvizhok.zip -d raspakovka
          # внутри архива одна папка с версией — переносим её содержимое
          VNUTRI=$(ls -d raspakovka/*/ | head -1)
          mv "$VNUTRI"* chromium/
          rm -rf raspakovka dvizhok.zip
          test -f chromium/chrome.exe || { echo "::error::chrome.exe не нашёлся после распаковки"; exit 1; }
          # ⛔ Переименовываем: в диспетчере задач должно быть видно НАШУ
          # программу, а не «chrome.exe». Движку своё имя безразлично —
          # chrome.dll он ищет рядом с собой, а не по имени файла.
          mv chromium/chrome.exe chromium/nexusbro-engine.exe
          test -f chromium/nexusbro-engine.exe
          test -f chromium/locales/en-US.pak || { echo "::error::в движке нет locales/en-US.pak"; exit 1; }
          du -sh chromium

      # Движок туннеля — только движок. ⛔ Никаких наших узлов, ключей и
      # подписок: человек вставляет своё.
      - name: Положить xray внутрь
        shell: bash
        working-directory: desktop/src-tauri
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            x86_64-pc-windows-msvc)   ASSET=Xray-windows-64.zip; BIN=xray.exe;;
            x86_64-unknown-linux-gnu) ASSET=Xray-linux-64.zip;   BIN=xray;;
            *) echo "::error::нет xray под ${{ matrix.target }}"; exit 1;;
          esac
          curl -fSL --retry 3 -o xray.zip \
            "https://github.com/XTLS/Xray-core/releases/latest/download/$ASSET"
          mkdir -p binaries
          unzip -o -q xray.zip "$BIN" -d binaries
          rm -f xray.zip
          chmod +x "binaries/$BIN" || true
          test -s "binaries/$BIN"
          ls -lh binaries

      - name: Поставить зависимости
        working-directory: desktop
        run: npm ci

      - name: Собрать
        working-directory: desktop
        shell: bash
        env:
          # Подпись артефактов автообновления (.sig рядом с установщиками).
          # Без секрета сборка идёт, но updater'у будет нечего проверять.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          # Кэш тащит из прошлых прогонов bundle/* прошлых версий. Тогда
          # глоб nsis/*.exe ловит несколько установщиков, а 7z x с
          # несколькими файлами считает лишние фильтрами имён и молча
          # распаковывает 0 файлов. Чистим — и в артефакте/релизе всегда
          # ровно один свежий пакет.
          rm -rf "src-tauri/target/${{ matrix.target }}/release/bundle"
          npm run tauri build -- --target ${{ matrix.target }}

      - name: Проверить содержимое установщика Windows
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/nsis-check"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          7z x -y desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe -o"$OUT" >/dev/null
          find "$OUT" -maxdepth 5 -type f | sort | head -100
          test -f "$OUT/chromium/nexusbro-engine.exe" || { echo "::error::в NSIS нет nexusbro-engine.exe"; exit 1; }
          test -f "$OUT/chromium/locales/en-US.pak" || { echo "::error::в NSIS нет chromium/locales/en-US.pak"; exit 1; }
          echo "Проверено: движок и locales/en-US.pak лежат на своих местах"

      - name: Выложить готовое
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          retention-days: 14
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe.sig
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb.sig
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm.sig

      - name: Приложить к выпуску
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # Черновик: публикует манифест автообновления (следующая задача).
          # Если опубликовать сразу, программы успеют увидеть релиз раньше
          # latest.json и словят «манифест не найден».
          draft: true
          files: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe.sig
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb.sig
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm.sig

  # Манифест latest.json для встроенного автообновления: собирается
  # из подписей (.sig), прикрепляется к релизу, и только после этого
  # релиз публикуется. Паттерн — как в NexusSSH.
  update-manifest:
    name: Манифест автообновления
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Собрать latest.json и опубликовать релиз
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          mkdir -p /tmp/sigs && cd /tmp/sigs
          gh release download "$TAG" --repo "$REPO" -p "*.sig"
          WIN_SIG=$(cat ./*.exe.sig 2>/dev/null | head -1 || true)
          DEB_SIG=$(cat ./*.deb.sig 2>/dev/null | head -1 || true)
          RPM_SIG=$(cat ./*.rpm.sig 2>/dev/null | head -1 || true)
          cd "$GITHUB_WORKSPACE"
          BASE="https://github.com/$REPO/releases/download/$TAG"
          pick() { gh release view "$TAG" --repo "$REPO" --json assets \
                   --jq ".assets[] | select(.name | endswith(\"$1\")) | .name" | head -1; }
          WIN_FILE=$(pick ".exe"); DEB_FILE=$(pick ".deb"); RPM_FILE=$(pick ".rpm")
          test -n "$WIN_FILE" && test -n "$WIN_SIG"
          test -n "$DEB_FILE" && test -n "$DEB_SIG"
          cat > latest.json <<EOF
          {
            "version": "$VERSION",
            "notes": "NexusBro $VERSION",
            "pub_date": "$DATE",
            "platforms": {
              "windows-x86_64":   { "signature": "$WIN_SIG", "url": "$BASE/$WIN_FILE" },
              "linux-x86_64-deb": { "signature": "$DEB_SIG", "url": "$BASE/$DEB_FILE" },
              "linux-x86_64-rpm": { "signature": "$RPM_SIG", "url": "$BASE/$RPM_FILE" },
              "linux-x86_64":     { "signature": "$DEB_SIG", "url": "$BASE/$DEB_FILE" }
            }
          }
          EOF
          cat latest.json
          gh release upload "$TAG" latest.json --repo "$REPO" --clobber
          gh release edit "$TAG" --repo "$REPO" --draft=false --latest
