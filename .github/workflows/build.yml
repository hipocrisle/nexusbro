name: Build NexusBro

on:
  push:
    branches: [main, cef-migration]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      frontend_only:
        description: Build frontend and isolated security tests (no CEF)
        type: boolean
        default: false
      runtime_build:
        description: Run only Windows screen test from an existing build run (empty = build)
        required: false
        default: ""
      linux_runtime_build:
        description: Repeat native Linux security tests from an existing matching app build
        required: false
        default: ""
      publish_tag:
        description: Publish existing tagged packages after successful runtime check (requires runtime_build)
        required: false
        default: ""
      runtime_baseline:
        description: Existing package predates NEXUSBRO_TEST_DATA (ephemeral runner only)
        type: boolean
        required: false
        default: false

jobs:
  security:
    if: >-
      !inputs.runtime_build && !inputs.linux_runtime_build &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test encrypted vault and independent account server
        run: |
          cargo test --manifest-path tests/security_vault_harness/Cargo.toml
          cargo test --manifest-path sync-server/Cargo.toml
          cargo build --release --locked --manifest-path sync-server/Cargo.toml
          cargo build --release --locked --manifest-path sync-server/Cargo.toml --example live_acceptance
          mkdir -p .dev-check/backend-package
          cp sync-server/target/release/nexusbro-sync-server .dev-check/backend-package/
          cp sync-server/target/release/examples/live_acceptance .dev-check/backend-package/
          cp sync-server/README.md .dev-check/backend-package/
          cp -r sync-server/deploy .dev-check/backend-package/
          cd .dev-check/backend-package
          sha256sum nexusbro-sync-server live_acceptance > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: nexusbro-sync-backend
          path: .dev-check/backend-package/
          retention-days: 14
  frontend:
    if: github.event_name == 'workflow_dispatch' && inputs.frontend_only
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci && npm run build
        working-directory: desktop
      - run: node --test tests/updater_visibility.cjs
      - run: |
          python3 -m pip install --break-system-packages playwright
          python3 tests/frontend_controls.py
          python3 tests/browser_ui_0213.py
          python3 tests/address_selection.py
          python3 tests/translation_dom.py
          python3 tests/library_state_0214.py
          python3 tests/super_colors_0214.py
          python3 tests/address_autocomplete_0214.py
          python3 tests/security_ui_browser.py
          python3 tests/cloud_supers.py
  build:
    needs: security
    # ⛔ Не запускать сборку для запросов из ЧУЖИХ копий репозитория: она
    # выполняет их же скрипты. Свои ветки и запросы собираются как обычно.
    if: >-
      !inputs.frontend_only && !inputs.runtime_build && !inputs.linux_runtime_build &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: nexusbro-windows
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: nexusbro-linux

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      # CEF 156.0.26 — ровно тот, что ждёт crate cef = 156.4.
      CEF_VERSION: "156.0.26+g8ea0c73+chromium-156.0.8078.88"
      CEF_BASE: "cef_binary_156.0.26+g8ea0c73+chromium-156.0.8078.88"
      CEF_SHA1_LINUX: cacfbb7d7261fea682fb67c108de7e4347519ff7
      CEF_SHA1_WINDOWS: 15d29eea209d857c22dc163706080295aea69b5c

    steps:
      - uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ⛔ Версия в настройках должна совпадать с меткой ДО выпуска, иначе
      # обновлятор зациклится. Проверяем сразу и падаем.
      - name: Сверить метку с версией
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: desktop
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          CONF_VER=$(node -p "require('./src-tauri/tauri.conf.json').version")
          PKG_VER=$(node -p "require('./package.json').version")
          echo "метка=$TAG_VER  tauri.conf.json=$CONF_VER  package.json=$PKG_VER"
          [ "$CONF_VER" = "$TAG_VER" ] || { echo "::error::версия в tauri.conf.json ($CONF_VER) ≠ метке"; exit 1; }
          [ "$PKG_VER" = "$TAG_VER" ]  || { echo "::error::версия в package.json ($PKG_VER) ≠ метке"; exit 1; }

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Identify runner image for the native compiler cache
        id: build_image
        shell: bash
        run: echo "key=${ImageOS:-$RUNNER_OS}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Запомнить сборочный кэш
        id: rust_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            desktop/src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ steps.build_image.outputs.key }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-${{ steps.build_image.outputs.key }}-

      - name: Зависимости Linux
        timeout-minutes: 12
        if: matrix.os == 'ubuntu-24.04'
        run: |
          # Hosted Ubuntu images select package mirrors through these files.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          if [ -f /etc/apt/apt-security-mirrors.txt ]; then
            printf '%s\n' 'https://security.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-security-mirrors.txt >/dev/null
          fi
          # Regional EC2 mirrors stalled small packages for many minutes.
          # Runner-only change; package signatures remain enforced by apt.
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i -E 's@https?://([a-z0-9.-]+\.)?archive\.ubuntu\.com/ubuntu/?@https://archive.ubuntu.com/ubuntu/@g' /etc/apt/sources.list.d/ubuntu.sources
          fi
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev pkg-config \
            libxcb1-dev patchelf rpm xvfb xdotool

      # Движок CEF кладём внутрь установщика (замена ungoogled-chromium,
      # ветка cef-migration). Архивные файлы лежат в Release/ и Resources/ —
      # выравниваем в корень cef/, оттуда tauri.conf.json кладёт их рядом
      # с exe. Кэш по версии CEF: не качаем 300 МБ на каждый прогон.
      - name: Кэш CEF
        id: kef
        uses: actions/cache@v4
        with:
          path: desktop/src-tauri/cef
          key: cef-${{ env.CEF_VERSION }}-${{ runner.os }}

      - name: Положить CEF внутрь
        if: steps.kef.outputs.cache-hit != 'true'
        shell: bash
        working-directory: desktop/src-tauri
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            x86_64-pc-windows-msvc) PLAT=windows64; SHA=$CEF_SHA1_WINDOWS;;
            x86_64-unknown-linux-gnu) PLAT=linux64;   SHA=$CEF_SHA1_LINUX;;
            *) echo "::error::нет CEF под ${{ matrix.target }}"; exit 1;;
          esac
          curl -fSL --retry 3 -o /tmp/cef.tar.bz2             "https://cef-builds.spotifycdn.com/${CEF_BASE}_${PLAT}_minimal.tar.bz2"
          echo "$SHA /tmp/cef.tar.bz2" | sha1sum -c -
          mkdir -p cef
          tar -xjf /tmp/cef.tar.bz2 -C cef --strip-components=1
          mv cef/Release/* cef/ 2>/dev/null || true
          mv cef/Resources/* cef/ 2>/dev/null || true
          rm -rf cef/Release cef/Resources
          # cef-dll-sys валидирует CEF_PATH по archive.json — пишем его.
          printf '{"type":"minimal","name":"%s","sha1":"%s"}' \
            "${CEF_BASE}_${PLAT}_minimal.tar.bz2" "$SHA" > cef/archive.json
          test -f cef/libcef.dll || test -f cef/libcef.so || { echo "::error::libcef не нашёлся после распаковки"; exit 1; }
          test -f cef/locales/en-US.pak || { echo "::error::в CEF нет locales/en-US.pak"; exit 1; }
          du -sh cef

      - name: Путь к CEF для сборки
        shell: bash
        run: echo "CEF_PATH=$GITHUB_WORKSPACE/desktop/src-tauri/cef" >> "$GITHUB_ENV"

      # Движок туннеля — только движок. ⛔ Никаких наших узлов, ключей и
      # подписок: человек вставляет своё.
      - name: Положить xray внутрь
        shell: bash
        working-directory: desktop/src-tauri
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            x86_64-pc-windows-msvc)   ASSET=Xray-windows-64.zip; BIN=xray.exe;;
            x86_64-unknown-linux-gnu) ASSET=Xray-linux-64.zip;   BIN=xray;;
            *) echo "::error::нет xray под ${{ matrix.target }}"; exit 1;;
          esac
          curl -fSL --retry 3 -o xray.zip \
            "https://github.com/XTLS/Xray-core/releases/latest/download/$ASSET"
          mkdir -p binaries
          unzip -o -q xray.zip "$BIN" geoip.dat geosite.dat -d binaries
          test -s binaries/geoip.dat
          test -s binaries/geosite.dat
          rm -f xray.zip
          chmod +x "binaries/$BIN" || true
          test -s "binaries/$BIN"
          ls -lh binaries
          python ../../tests/xray_assets.py --bin "binaries/$BIN"

      - name: Поставить зависимости
        working-directory: desktop
        run: npm ci

      - name: Собрать
        working-directory: desktop
        shell: bash
        env:
          # Подпись артефактов автообновления (.sig рядом с установщиками).
          # Без секрета сборка идёт, но updater'у будет нечего проверять.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          # Кэш тащит из прошлых прогонов bundle/* прошлых версий. Тогда
          # глоб nsis/*.exe ловит несколько установщиков, а 7z x с
          # несколькими файлами считает лишние фильтрами имён и молча
          # распаковывает 0 файлов. Чистим — и в артефакте/релизе всегда
          # ровно один свежий пакет.
          rm -rf "src-tauri/target/${{ matrix.target }}/release/bundle"
          npm run tauri build -- --target ${{ matrix.target }}

      - name: Сохранить сборочный кэш до runtime-проверки
        if: steps.rust_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            desktop/src-tauri/target/
          key: ${{ steps.rust_cache.outputs.cache-primary-key }}

      - name: Сохранить Linux-бинарник для проверки без повторной сборки
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: nexusbro-linux-runtime
          path: desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/nexusbro
          retention-days: 7

      - name: Проверить списки и подписки в интерфейсе
        if: matrix.os == 'ubuntu-24.04'
        run: |
          node --test tests/updater_visibility.cjs
          python3 -m pip install --break-system-packages playwright
          python3 tests/frontend_controls.py
          python3 tests/browser_ui_0213.py
          python3 tests/address_selection.py
          python3 tests/translation_dom.py
          python3 tests/library_state_0214.py
          python3 tests/super_colors_0214.py
          python3 tests/address_autocomplete_0214.py
          python3 tests/security_ui_browser.py
          python3 tests/cloud_supers.py

      - name: Проверить CEF и окна Linux под Xvfb
        if: matrix.os == 'ubuntu-24.04'
        run: |
          python3 -m pip install --break-system-packages websocket-client psutil Pillow
          BIN=desktop/src-tauri/target/${{ matrix.target }}/release/nexusbro
          readelf --dyn-syms --wide "$BIN" | awk '$5=="GLOBAL" && $6=="DEFAULT" && $7!="UND" && $8 ~ /^sqlite3_/ {bad=1} END {exit bad}'
          python3 tests/gui/linux_smoke.py --exe "$BIN" --cef desktop/src-tauri/cef --out .dev-check/linux-runtime

      - uses: actions/download-artifact@v4
        if: matrix.os == 'ubuntu-24.04'
        with:
          name: nexusbro-sync-backend
          path: .dev-check/backend-package
      - name: Verify backend artifact
        if: matrix.os == 'ubuntu-24.04'
        working-directory: .dev-check/backend-package
        run: |
          sha256sum -c SHA256SUMS
          chmod +x nexusbro-sync-server
      - name: Native encrypted vault, CEF credentials and two-device sync
        if: matrix.os == 'ubuntu-24.04'
        timeout-minutes: 10
        run: |
          python3 tests/gui/security_native.py --exe desktop/src-tauri/target/${{ matrix.target }}/release/nexusbro --cef desktop/src-tauri/cef --server .dev-check/backend-package/nexusbro-sync-server --out .dev-check/security-native
      - uses: actions/upload-artifact@v4
        if: always() && matrix.os == 'ubuntu-24.04'
        with:
          name: native-security-verification
          path: |
            .dev-check/security-native/results.json
            .dev-check/security-native/*.png
            .dev-check/security-native/*.log
            .dev-check/security-native/*/*.log
          retention-days: 14
      - name: Сохранить Linux runtime диагностику
        if: always() && matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: linux-runtime-verification
          path: |
            .dev-check/linux-runtime/*.json
            .dev-check/linux-runtime/*.png
            .dev-check/linux-runtime/*.log
            .dev-check/linux-runtime/data/zhurnal.log
            .dev-check/linux-runtime/data/profili/*/cef.log
            .dev-check/linux-runtime/data/profili/*/obychnye.json
          retention-days: 14

      - name: Проверить отрисовку Windows на экране
        if: matrix.os == 'windows-latest'
        timeout-minutes: 10
        shell: pwsh
        run: |
          python -m pip install Pillow pyautogui pywinauto psutil
          $installer = Get-ChildItem desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe | Select-Object -First 1
          7z x -y $installer.FullName "-o.dev-check/installed"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/xray_assets.py --bin .dev-check/installed/binaries/xray.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/gui/windows_physical.py --exe .dev-check/installed/nexusbro.exe --cef .dev-check/installed --out .dev-check/windows-render
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Сохранить Windows runtime диагностику
        if: always() && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-render-verification
          path: |
            .dev-check/windows-render/*.png
            .dev-check/windows-render/*.txt
            .dev-check/windows-render/*.json
            .dev-check/windows-render/data/zhurnal.log
            .dev-check/windows-render/data/profili/*/cef*.log
            .dev-check/windows-render/data/profili/*/obychnye.json
          retention-days: 14

      - name: Проверить содержимое установщика Windows
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/nsis-check"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          7z x -y desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe -o"$OUT" >/dev/null
          find "$OUT" -maxdepth 5 -type f | sort | head -100
          test -f "$OUT/libcef.dll" || { echo "::error::в NSIS нет libcef.dll"; exit 1; }
          test -f "$OUT/locales/en-US.pak" || { echo "::error::в NSIS нет locales/en-US.pak"; exit 1; }
          echo "Проверено: libcef.dll и locales/en-US.pak лежат рядом с exe"

      - name: Выложить готовое
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          retention-days: 14
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe.sig
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb.sig
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm.sig

      - name: Приложить к выпуску
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # Черновик: публикует манифест автообновления (следующая задача).
          # Если опубликовать сразу, программы успеют увидеть релиз раньше
          # latest.json и словят «манифест не найден».
          draft: true
          files: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe.sig
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb.sig
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm.sig

  runtime:
    if: github.event_name == 'workflow_dispatch' && inputs.runtime_build != ''
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nexusbro-windows
          path: .dev-check/package
          run-id: ${{ inputs.runtime_build }}
          github-token: ${{ github.token }}
      - name: Extract installer and check actual Windows screen
        shell: pwsh
        run: |
          $installer = Get-ChildItem .dev-check/package -Recurse -Filter *.exe | Select-Object -First 1
          if (-not $installer) { throw "Installer missing" }
          7z x -y $installer.FullName "-o.dev-check/installed"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install Pillow pyautogui pywinauto psutil
          $extra = @()
          if ("${{ inputs.runtime_baseline }}" -eq "true") { $extra += "--baseline" }
          python tests/xray_assets.py --bin .dev-check/installed/binaries/xray.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/gui/windows_physical.py --exe .dev-check/installed/nexusbro.exe --cef .dev-check/installed --out .dev-check/windows-render @extra
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save screen and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-render-verification
          path: |
            .dev-check/windows-render/*.png
            .dev-check/windows-render/*.txt
            .dev-check/windows-render/*.json
            .dev-check/windows-render/data/zhurnal.log
            .dev-check/windows-render/data/profili/*/cef*.log
            .dev-check/windows-render/data/profili/*/obychnye.json
          retention-days: 14

  # Манифест latest.json для встроенного автообновления: собирается
  # из подписей (.sig), прикрепляется к релизу, и только после этого
  # релиз публикуется. Паттерн — как в NexusSSH.
  update-manifest:
    name: Манифест автообновления
    needs: [build, security]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Собрать latest.json и опубликовать релиз
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          mkdir -p /tmp/sigs && cd /tmp/sigs
          gh release download "$TAG" --repo "$REPO" -p "*.sig"
          WIN_SIG=$(cat ./*.exe.sig 2>/dev/null | head -1 || true)
          DEB_SIG=$(cat ./*.deb.sig 2>/dev/null | head -1 || true)
          RPM_SIG=$(cat ./*.rpm.sig 2>/dev/null | head -1 || true)
          cd "$GITHUB_WORKSPACE"
          BASE="https://github.com/$REPO/releases/download/$TAG"
          pick() { gh release view "$TAG" --repo "$REPO" --json assets \
                   --jq ".assets[] | select(.name | endswith(\"$1\")) | .name" | head -1; }
          WIN_FILE=$(pick ".exe"); DEB_FILE=$(pick ".deb"); RPM_FILE=$(pick ".rpm")
          test -n "$WIN_FILE" && test -n "$WIN_SIG"
          test -n "$DEB_FILE" && test -n "$DEB_SIG"
          cat > latest.json <<EOF
          {
            "version": "$VERSION",
            "notes": "NexusBro $VERSION",
            "pub_date": "$DATE",
            "platforms": {
              "windows-x86_64":   { "signature": "$WIN_SIG", "url": "$BASE/$WIN_FILE" },
              "linux-x86_64-deb": { "signature": "$DEB_SIG", "url": "$BASE/$DEB_FILE" },
              "linux-x86_64-rpm": { "signature": "$RPM_SIG", "url": "$BASE/$RPM_FILE" },
              "linux-x86_64":     { "signature": "$DEB_SIG", "url": "$BASE/$DEB_FILE" }
            }
          }
          EOF
          cat latest.json
          # Не публикуем обновление, пока payload, trusted comment и manifest
          # не проверены публичным ключом из приложения.
          python3 -m pip install cryptography
          gh release download "$TAG" --repo "$REPO" -D /tmp/payloads -p "*.exe" -p "*.deb" -p "*.rpm" -p "*.sig"
          cp latest.json /tmp/payloads/latest.json
          python3 tests/release_signatures.py --directory /tmp/payloads --version "$VERSION"
          gh release upload "$TAG" latest.json /tmp/payloads/signature-verification.json --repo "$REPO" --clobber
          gh release edit "$TAG" --repo "$REPO" --notes-file "docs/RELEASE-$VERSION.md" --draft=false --latest

  linux-runtime:
    name: Native Linux from existing matching binary
    if: github.event_name == 'workflow_dispatch' && inputs.linux_runtime_build != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install native acceptance QR decoder and TypeScript
        run: npm ci --prefix desktop
      - name: Verify app sources match the binary run
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.linux_runtime_build }}
        run: |
          set -euo pipefail
          SOURCE=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" --jq .head_sha)
          git fetch --no-tags origin "$SOURCE"
          git diff --exit-code "$SOURCE" HEAD -- desktop
          echo "Native binary source: $SOURCE; test source: $GITHUB_SHA"
      - uses: actions/download-artifact@v4
        with:
          name: nexusbro-linux-runtime
          path: .dev-check/native-binary
          run-id: ${{ inputs.linux_runtime_build }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: nexusbro-sync-backend
          path: .dev-check/backend-package
          run-id: ${{ inputs.linux_runtime_build }}
          github-token: ${{ github.token }}
      - name: Runtime dependencies and verified CEF
        timeout-minutes: 10
        run: |
          set -euo pipefail
          # Hosted Ubuntu images select package mirrors through these files.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          if [ -f /etc/apt/apt-security-mirrors.txt ]; then
            printf '%s\n' 'https://security.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-security-mirrors.txt >/dev/null
          fi
          # Regional EC2 mirrors stalled small packages for many minutes.
          # Runner-only change; package signatures remain enforced by apt.
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i -E 's@https?://([a-z0-9.-]+\.)?archive\.ubuntu\.com/ubuntu/?@https://archive.ubuntu.com/ubuntu/@g' /etc/apt/sources.list.d/ubuntu.sources
          fi
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-0 libgtk-3-0t64 libayatana-appindicator3-1 librsvg2-2 xvfb xdotool
          python3 -m pip install --break-system-packages websocket-client psutil Pillow
          curl -fSL --connect-timeout 20 --max-time 180 --retry 3 --retry-max-time 240 -o /tmp/cef.tar.bz2 'https://cef-builds.spotifycdn.com/cef_binary_156.0.26+g8ea0c73+chromium-156.0.8078.88_linux64_minimal.tar.bz2'
          echo 'cacfbb7d7261fea682fb67c108de7e4347519ff7 /tmp/cef.tar.bz2' | sha1sum -c -
          mkdir -p .dev-check/cef
          tar -xjf /tmp/cef.tar.bz2 -C .dev-check/cef --strip-components=1
          mv .dev-check/cef/Release/* .dev-check/cef/
          mv .dev-check/cef/Resources/* .dev-check/cef/
          chmod +x .dev-check/native-binary/nexusbro .dev-check/backend-package/nexusbro-sync-server
          (cd .dev-check/backend-package && sha256sum -c SHA256SUMS)
      - name: Native encrypted vault, UI lock and two-device sync
        timeout-minutes: 10
        run: python3 tests/gui/security_native.py --exe .dev-check/native-binary/nexusbro --cef .dev-check/cef --server .dev-check/backend-package/nexusbro-sync-server --out .dev-check/security-native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-security-verification
          path: |
            .dev-check/security-native/results.json
            .dev-check/security-native/*.png
            .dev-check/security-native/*.log
            .dev-check/security-native/*/*.log
          retention-days: 14

  publish-tested:
    name: Publish runtime-verified existing packages
    needs: runtime
    if: github.event_name == 'workflow_dispatch' && inputs.runtime_build != '' && inputs.publish_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install cryptography
      - name: Verify tag, Linux acceptance, signatures and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.publish_tag }}
          BUILD_RUN: ${{ inputs.runtime_build }}
        run: python3 tests/publish_tested_release.py
