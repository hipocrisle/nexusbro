          python3 tests/gui/session_recovery.py --exe "$BIN" --cef desktop/src-tauri/cef --out .dev-check/session-recovery-native
          python3 tests/gui/sync_history_native.py --exe "$BIN" --cef desktop/src-tauri/cef --out .dev-check/sync-history-native
          python3 tests/gui/backup_native.py --exe "$BIN" --cef desktop/src-tauri/cef --out .dev-check/backup-native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-essentials-${{ matrix.os }}
          path: |
            .dev-check/browser-essentials/results.json
            .dev-check/browser-essentials/*.png
            .dev-check/browser-essentials/*.log
            .dev-check/session-recovery-native/results.json
            .dev-check/session-recovery-native/*.log
            .dev-check/sync-history-native/results.json
            .dev-check/sync-history-native/*.png
            .dev-check/backup-native/results.json
            .dev-check/backup-native/*.log
          retention-days: 14

      - name: Проверить содержимое установщика Windows
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/nsis-check"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          7z x -y desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe -o"$OUT" >/dev/null
          find "$OUT" -maxdepth 5 -type f | sort | head -100
          test -f "$OUT/libcef.dll" || { echo "::error::в NSIS нет libcef.dll"; exit 1; }
          test -f "$OUT/locales/en-US.pak" || { echo "::error::в NSIS нет locales/en-US.pak"; exit 1; }
          echo "Проверено: libcef.dll и locales/en-US.pak лежат рядом с exe"

      - name: Выложить готовое
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          retention-days: 14
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe.sig
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb.sig
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm.sig

      - name: Приложить к выпуску
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # Черновик: публикует манифест автообновления (следующая задача).
          # Если опубликовать сразу, программы успеют увидеть релиз раньше
          # latest.json и словят «манифест не найден».
          draft: true
          files: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe.sig
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb.sig
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm.sig


  resource-soak:
    if: github.event_name == 'workflow_dispatch' && inputs.performance_build != '' && inputs.resource_soak != ''
    uses: ./.github/workflows/resource-soak.yml
    permissions:
      contents: read
      actions: read
    with:
      build_run: ${{ inputs.performance_build }}
      source: ${{ fromJSON(inputs.resource_soak).source }}
      baseline: ${{ fromJSON(inputs.resource_soak).baseline }}
      diagnostic_pilot: ${{ fromJSON(inputs.resource_soak).diagnostic_pilot }}
      pilot_seconds: ${{ fromJSON(inputs.resource_soak).pilot_seconds }}
      platform: ${{ fromJSON(inputs.resource_soak).platform }}

  performance:
    name: Windows many-tab performance measurement
    if: github.event_name == 'workflow_dispatch' && inputs.performance_build != '' && inputs.resource_soak == ''
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Record measured package provenance
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.performance_build }}
          REFERENCE_RUN: ${{ inputs.performance_reference }}
        run: |
          New-Item -ItemType Directory -Force .dev-check/performance-provenance | Out-Null
          gh api "repos/${{ github.repository }}/actions/runs/$env:BUILD_RUN" > .dev-check/performance-provenance/source-run.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:REFERENCE_RUN) {
            gh api "repos/${{ github.repository }}/actions/runs/$env:REFERENCE_RUN" > .dev-check/performance-provenance/reference-run.json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/download-artifact@v4
        with:
          name: nexusbro-windows
          path: .dev-check/package
          run-id: ${{ inputs.performance_build }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: inputs.performance_reference != ''
        with:
          name: nexusbro-windows
          path: .dev-check/reference-package
          run-id: ${{ inputs.performance_reference }}
          github-token: ${{ github.token }}
      - name: Measure real Windows process tree and page workload
        shell: pwsh
        env:
          PERF_SAVED_TABS: ${{ inputs.performance_saved_tabs }}
          PERF_SUPERS: ${{ inputs.performance_supers }}
          PERF_LIVE_TABS: ${{ inputs.performance_live_tabs }}
          REFERENCE_RUN: ${{ inputs.performance_reference }}
          PERF_VISIBILITY: ${{ inputs.performance_visibility }}
          PERF_EXPECT_THROTTLED: ${{ inputs.performance_expect_throttled }}
          PERF_NATIVE_DIAGNOSTIC: ${{ inputs.performance_native_diagnostic }}
        run: |
          $extra = @()
          $referenceExtra = @()
          if ($env:PERF_VISIBILITY -eq "true") { $extra += "--visibility-probe"; $referenceExtra += "--visibility-probe" }
          if ($env:PERF_EXPECT_THROTTLED -eq "true") { $extra += "--expect-background-throttled" }
          if ($env:PERF_NATIVE_DIAGNOSTIC -eq "true") { $extra += "--diagnostic-native-hide" }
          $installers = @(Get-ChildItem .dev-check/package -Recurse -Filter *.exe)
          if ($installers.Count -ne 1) { throw "Expected exactly one measured installer" }
          Get-FileHash -Algorithm SHA256 $installers[0].FullName | ConvertTo-Json > .dev-check/performance-provenance/installer-sha256.json
          7z x -y $installers[0].FullName "-o.dev-check/installed"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:GITHUB_ACTIONS -ne "true") { throw "Paired alias is restricted to the disposable runner" }
          Add-Content -Path "$env:SystemRoot\System32\drivers\etc\hosts" -Value "127.0.0.1 nexusbro-perf.test" -Encoding ascii
          python -m pip install Pillow pyautogui pywinauto psutil websocket-client cryptography
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:REFERENCE_RUN) {
            $reference = @(Get-ChildItem .dev-check/reference-package -Recurse -Filter *.exe)
            if ($reference.Count -ne 1) { throw "Expected exactly one reference installer" }
            Get-FileHash -Algorithm SHA256 $reference[0].FullName | ConvertTo-Json > .dev-check/performance-provenance/reference-sha256.json
            7z x -y $reference[0].FullName "-o.dev-check/reference-installed"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python tests/gui/performance_windows.py --exe .dev-check/reference-installed/nexusbro.exe --cef .dev-check/reference-installed --out .dev-check/performance-reference --origin-host nexusbro-perf.test --saved-tabs $env:PERF_SAVED_TABS --supers $env:PERF_SUPERS --tabs $env:PERF_LIVE_TABS @referenceExtra
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          python tests/gui/performance_windows.py --exe .dev-check/installed/nexusbro.exe --cef .dev-check/installed --out .dev-check/performance --origin-host nexusbro-perf.test --saved-tabs $env:PERF_SAVED_TABS --supers $env:PERF_SUPERS --tabs $env:PERF_LIVE_TABS @extra
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-performance-measurement
          path: |
            .dev-check/performance-provenance/
            .dev-check/performance/*.json
            .dev-check/performance/*.png
            .dev-check/performance/*.log
            .dev-check/performance/data/zhurnal.log
            .dev-check/performance/data/profili/*/cef*.log
            .dev-check/performance-reference/*.json
            .dev-check/performance-reference/*.png
            .dev-check/performance-reference/*.log
            .dev-check/performance-reference/data/zhurnal.log
            .dev-check/performance-reference/data/profili/*/cef*.log
          retention-days: 14

  runtime:
    if: github.event_name == 'workflow_dispatch' && inputs.runtime_build != ''
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate diagnostic runtime mode
        shell: pwsh
        run: |
          if ("${{ inputs.runtime_memory_only }}" -eq "true" -and ("${{ inputs.runtime_baseline }}" -eq "true" -or "${{ inputs.publish_tag }}" -ne "")) { throw "Memory-only diagnostics cannot test a baseline or publish" }
      - name: Verify app sources match the Windows installer run
        if: ${{ !inputs.runtime_baseline }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.runtime_build }}
        run: |
          $source = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:BUILD_RUN" --jq .head_sha
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git fetch --no-tags origin $source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code $source HEAD -- desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/download-artifact@v4
        with:
          name: nexusbro-windows
          path: .dev-check/package
          run-id: ${{ inputs.runtime_build }}
          github-token: ${{ github.token }}
      - name: Extract installer and check actual Windows screen
        shell: pwsh
        run: |
          $installer = Get-ChildItem .dev-check/package -Recurse -Filter *.exe | Select-Object -First 1
          if (-not $installer) { throw "Installer missing" }
          7z x -y $installer.FullName "-o.dev-check/installed"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install Pillow pyautogui pywinauto psutil websocket-client cryptography
          $extra = @()
          if ("${{ inputs.runtime_baseline }}" -eq "true") { $extra += "--baseline" }
          python tests/xray_assets.py --bin .dev-check/installed/binaries/xray.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ("${{ inputs.runtime_memory_only }}" -ne "true") {
            python tests/gui/windows_physical.py --exe .dev-check/installed/nexusbro.exe --cef .dev-check/installed --out .dev-check/windows-render @extra
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Preserve physical interaction checkpoint before later native gates
        uses: actions/upload-artifact@v4
        if: ${{ always() && !inputs.runtime_memory_only }}
        with:
          name: windows-physical-checkpoint
          path: .dev-check/windows-render/results.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Native Windows per-tab routes and trusted HTTPS
        if: ${{ !inputs.runtime_memory_only && !inputs.runtime_baseline }}
        timeout-minutes: 10
        shell: pwsh
        run: |
          python tests/gui/route_ca.py --out .dev-check/routes-ca
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -Path "$env:SystemRoot\System32\drivers\etc\hosts" -Value "127.0.0.1 nexusbro-route-stun.test" -Encoding ascii
          # User Root imports can block on an invisible confirmation dialog.
          # This is an elevated, disposable GitHub VM, never the developer host.
          if ($env:GITHUB_ACTIONS -ne "true") { throw "Fixture trust is runner-only" }
          $fixtureRoot = Import-Certificate -FilePath .dev-check/routes-ca/ca.crt -CertStoreLocation Cert:\LocalMachine\Root -Confirm:$false -ErrorAction Stop
          if (-not $fixtureRoot -or -not (Test-Path "Cert:\LocalMachine\Root\$($fixtureRoot.Thumbprint)")) { throw "Fixture CA was not installed" }
          Write-Host "Disposable fixture CA installed; starting native routes"
          python tests/gui/tab_routes.py --exe .dev-check/installed/nexusbro.exe --cef .dev-check/installed --out .dev-check/native-routes --tls-cert .dev-check/routes-ca/server.crt --tls-key .dev-check/routes-ca/server.key
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always() && !inputs.runtime_memory_only && !inputs.runtime_baseline
        with:
          name: windows-route-verification
          path: |
            .dev-check/native-routes/*.json
            .dev-check/native-routes/*.png
            .dev-check/native-routes/device/data/zhurnal.log
            .dev-check/native-routes/device/data/profili/*/obychnye.json
            .dev-check/native-routes/device/*.log
            .dev-check/native-routes/device/data/profili/*/cef*.log
          retention-days: 14
      - name: Verify real background lifecycle of the exact measured installer
        if: ${{ !inputs.runtime_memory_only }}
        timeout-minutes: 6
        shell: pwsh
        run: |
          python tests/gui/performance_windows.py --exe .dev-check/installed/nexusbro.exe --cef .dev-check/installed --out .dev-check/windows-background --supers 2 --tabs 2 --saved-tabs 2 --visibility-probe --expect-background-throttled --timeout 300
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-background-visibility
          path: |
            .dev-check/windows-background/*.json
            .dev-check/windows-background/*.png
            .dev-check/windows-background/*.log
            .dev-check/windows-background/data/profili/*/cef*.log
          retention-days: 14
      - name: Verify real automatic unloading and continuing media in the same installer
        if: ${{ !inputs.runtime_baseline }}
        timeout-minutes: 12
        shell: pwsh
        run: |
          python tests/gui/memory_windows.py --exe .dev-check/installed/nexusbro.exe --cef .dev-check/installed --out .dev-check/windows-memory --timeout 600
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always() && !inputs.runtime_baseline
        with:
          name: windows-memory-verification
          path: |
            .dev-check/windows-memory/*.json
            .dev-check/windows-memory/*.png
            .dev-check/windows-memory/*.log
            .dev-check/windows-memory/data/zhurnal.log
            .dev-check/windows-memory/data/profili/*/cef*.log
            .dev-check/windows-memory/data/profili/*/obychnye.json
          retention-days: 14
      - name: Native browser essentials of the same Windows installer
        if: ${{ !inputs.runtime_memory_only && !inputs.runtime_baseline }}
        timeout-minutes: 6
        shell: pwsh
        run: |
          python tests/gui/browser_essentials_native.py --exe .dev-check/installed/nexusbro.exe --cef .dev-check/installed --out .dev-check/browser-essentials
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always() && !inputs.runtime_memory_only && !inputs.runtime_baseline
        with:
          name: browser-essentials-windows-runtime
          path: |
            .dev-check/browser-essentials/results.json
            .dev-check/browser-essentials/*.png
            .dev-check/browser-essentials/*.log
          retention-days: 14
      - name: Save screen and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-render-verification
          path: |
            .dev-check/windows-render/*.png
            .dev-check/windows-render/*.txt
            .dev-check/windows-render/*.json
            .dev-check/windows-render/data/zhurnal.log
            .dev-check/windows-render/data/profili/*/cef*.log
            .dev-check/windows-render/data/profili/*/obychnye.json
          retention-days: 14

  # Манифест latest.json для встроенного автообновления: собирается
  # из подписей (.sig), прикрепляется к релизу, и только после этого
  # релиз публикуется. Паттерн — как в NexusSSH.
  update-manifest:
    name: Манифест автообновления
    needs: [build, security]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Собрать latest.json и опубликовать релиз
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          mkdir -p /tmp/sigs && cd /tmp/sigs
          gh release download "$TAG" --repo "$REPO" -p "*.sig"
          WIN_SIG=$(cat ./*.exe.sig 2>/dev/null | head -1 || true)
          DEB_SIG=$(cat ./*.deb.sig 2>/dev/null | head -1 || true)
          RPM_SIG=$(cat ./*.rpm.sig 2>/dev/null | head -1 || true)
          cd "$GITHUB_WORKSPACE"
          BASE="https://github.com/$REPO/releases/download/$TAG"
          pick() { gh release view "$TAG" --repo "$REPO" --json assets \
                   --jq ".assets[] | select(.name | endswith(\"$1\")) | .name" | head -1; }
          WIN_FILE=$(pick ".exe"); DEB_FILE=$(pick ".deb"); RPM_FILE=$(pick ".rpm")
          test -n "$WIN_FILE" && test -n "$WIN_SIG"
          test -n "$DEB_FILE" && test -n "$DEB_SIG"
          cat > latest.json <<EOF
          {
            "version": "$VERSION",
            "notes": "NexusBro $VERSION",
            "pub_date": "$DATE",
            "platforms": {
              "windows-x86_64":   { "signature": "$WIN_SIG", "url": "$BASE/$WIN_FILE" },
              "linux-x86_64-deb": { "signature": "$DEB_SIG", "url": "$BASE/$DEB_FILE" },
              "linux-x86_64-rpm": { "signature": "$RPM_SIG", "url": "$BASE/$RPM_FILE" },
              "linux-x86_64":     { "signature": "$DEB_SIG", "url": "$BASE/$DEB_FILE" }
            }
          }
          EOF
          cat latest.json
          # Не публикуем обновление, пока payload, trusted comment и manifest
          # не проверены публичным ключом из приложения.
          python3 -m pip install cryptography
          gh release download "$TAG" --repo "$REPO" -D /tmp/payloads -p "*.exe" -p "*.deb" -p "*.rpm" -p "*.sig"
          cp latest.json /tmp/payloads/latest.json
          python3 tests/release_signatures.py --directory /tmp/payloads --version "$VERSION"
          gh release upload "$TAG" latest.json /tmp/payloads/signature-verification.json --repo "$REPO" --clobber
          gh release edit "$TAG" --repo "$REPO" --notes-file "docs/RELEASE-$VERSION.md" --draft=false --latest

  linux-runtime:
    name: Native Linux from existing matching binary
    if: github.event_name == 'workflow_dispatch' && inputs.linux_runtime_build != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install native acceptance QR decoder and TypeScript
        run: npm ci --prefix desktop && npm run build --prefix desktop
      - name: Verify app sources match the binary run
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.linux_runtime_build }}
        run: |
          set -euo pipefail
          SOURCE=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" --jq .head_sha)
          git fetch --no-tags origin "$SOURCE"
          git diff --exit-code "$SOURCE" HEAD -- desktop
          echo "Native binary source: $SOURCE; test source: $GITHUB_SHA"
      - uses: actions/download-artifact@v4
        with:
          name: nexusbro-linux-runtime
          path: .dev-check/native-binary
          run-id: ${{ inputs.linux_runtime_build }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: nexusbro-sync-backend
          path: .dev-check/backend-package
          run-id: ${{ inputs.linux_runtime_build }}
          github-token: ${{ github.token }}
      - name: Runtime dependencies and verified CEF
        timeout-minutes: 10
        run: |
          set -euo pipefail
          # Hosted Ubuntu images select package mirrors through these files.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          if [ -f /etc/apt/apt-security-mirrors.txt ]; then
            printf '%s\n' 'https://security.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-security-mirrors.txt >/dev/null
          fi
          # Regional EC2 mirrors stalled small packages for many minutes.
          # Runner-only change; package signatures remain enforced by apt.
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i -E -e 's@https?://([a-z0-9.-]+\.)?archive\.ubuntu\.com/ubuntu/?@https://archive.ubuntu.com/ubuntu/@g' -e 's@http://security\.ubuntu\.com/ubuntu/?@https://security.ubuntu.com/ubuntu/@g' /etc/apt/sources.list.d/ubuntu.sources
          fi
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends libwebkit2gtk-4.1-0 libgtk-3-0t64 libayatana-appindicator3-1 librsvg2-2 xvfb xdotool xclip libnss3-tools
          python3 -m pip install --break-system-packages websocket-client psutil Pillow cryptography playwright
          curl -fSL --connect-timeout 20 --max-time 180 --retry 3 --retry-max-time 240 -o /tmp/cef.tar.bz2 'https://cef-builds.spotifycdn.com/cef_binary_156.0.26+g8ea0c73+chromium-156.0.8078.88_linux64_minimal.tar.bz2'
          echo 'cacfbb7d7261fea682fb67c108de7e4347519ff7 /tmp/cef.tar.bz2' | sha1sum -c -
          mkdir -p .dev-check/cef
          tar -xjf /tmp/cef.tar.bz2 -C .dev-check/cef --strip-components=1
          mv .dev-check/cef/Release/* .dev-check/cef/
          mv .dev-check/cef/Resources/* .dev-check/cef/
          chmod +x .dev-check/native-binary/nexusbro .dev-check/backend-package/nexusbro-sync-server
          (cd .dev-check/backend-package && sha256sum -c SHA256SUMS)
      - name: Check corrected browser fixtures against unchanged application sources
        if: ${{ !inputs.linux_memory_diagnostic }}
        run: |
          python3 tests/backup_browser.py
          python3 tests/updater_startup_browser.py
          python3 tests/updater_app_startup_browser.py
      - name: Native Linux smoke from exact existing binary
        if: ${{ !inputs.linux_memory_diagnostic }}
        run: python3 tests/gui/linux_smoke.py --exe .dev-check/native-binary/nexusbro --cef .dev-check/cef --out .dev-check/linux-runtime
      - uses: actions/upload-artifact@v4
        if: always() && !inputs.linux_memory_diagnostic
        with:
          name: linux-runtime-verification
          path: |
            .dev-check/linux-runtime/results.json
            .dev-check/linux-runtime/*.png
            .dev-check/linux-runtime/*.log
          retention-days: 14
      - name: Native memory-bootstrap diagnostics only
        if: ${{ inputs.linux_memory_diagnostic }}
        timeout-minutes: 4
        run: |
          test -z "${{ inputs.publish_tag }}"
          python3 tests/gui/memory_bootstrap_native.py --exe .dev-check/native-binary/nexusbro --cef .dev-check/cef --out .dev-check/native-memory-diagnostic --safe-unload
      - uses: actions/upload-artifact@v4
        if: always() && inputs.linux_memory_diagnostic
        with:
          name: native-memory-bootstrap-diagnostic
          path: .dev-check/native-memory-diagnostic/results.json
          retention-days: 14
      - name: Native per-tab routes, isolated profiles and trusted HTTPS
        if: ${{ !inputs.linux_memory_diagnostic }}
        timeout-minutes: 10
        run: |
          python3 tests/gui/route_ca.py --out .dev-check/routes-ca
          printf '%s\n' '127.0.0.1 nexusbro-route-stun.test' | sudo tee -a /etc/hosts >/dev/null
          sudo cp .dev-check/routes-ca/ca.crt /usr/local/share/ca-certificates/nexusbro-route-fixture.crt
          sudo update-ca-certificates
          mkdir -p "$HOME/.pki/nssdb"
          if [ ! -f "$HOME/.pki/nssdb/cert9.db" ]; then certutil -N -d "sql:$HOME/.pki/nssdb" --empty-password; fi
          certutil -A -d "sql:$HOME/.pki/nssdb" -n nexusbro-route-fixture -t 'C,,' -i .dev-check/routes-ca/ca.crt
          python3 tests/gui/tab_routes.py --exe .dev-check/native-binary/nexusbro --cef .dev-check/cef --out .dev-check/native-routes --tls-cert .dev-check/routes-ca/server.crt --tls-key .dev-check/routes-ca/server.key
      - uses: actions/upload-artifact@v4
        if: always() && !inputs.linux_memory_diagnostic
        with:
          name: linux-route-verification
          path: |
            .dev-check/native-routes/*.json
            .dev-check/native-routes/*.png
            .dev-check/native-routes/device/data/zhurnal.log
            .dev-check/native-routes/device/data/profili/*/obychnye.json
            .dev-check/native-routes/device/*.log
            .dev-check/native-routes/device/data/profili/*/cef*.log
          retention-days: 14
      - name: Native encrypted vault, UI lock and two-device sync
        if: ${{ !inputs.linux_memory_diagnostic }}
        timeout-minutes: 10
        run: python3 tests/gui/security_native.py --exe .dev-check/native-binary/nexusbro --cef .dev-check/cef --server .dev-check/backend-package/nexusbro-sync-server --out .dev-check/security-native
      - uses: actions/upload-artifact@v4
        if: always() && !inputs.linux_memory_diagnostic
        with:
          name: native-security-verification
          path: |
            .dev-check/security-native/results.json
            .dev-check/security-native/*.png
            .dev-check/security-native/*.log
            .dev-check/security-native/*/*.log
          retention-days: 14

      - name: Native browser essentials from exact existing binary
        if: ${{ !inputs.linux_memory_diagnostic }}
        run: |
          BIN=.dev-check/native-binary/nexusbro
          python3 tests/gui/browser_essentials_native.py --exe "$BIN" --cef .dev-check/cef --out .dev-check/browser-essentials
          python3 tests/gui/session_recovery.py --exe "$BIN" --cef .dev-check/cef --out .dev-check/session-recovery-native
          python3 tests/gui/sync_history_native.py --exe "$BIN" --cef .dev-check/cef --out .dev-check/sync-history-native
          python3 tests/gui/backup_native.py --exe "$BIN" --cef .dev-check/cef --out .dev-check/backup-native
      - uses: actions/upload-artifact@v4
        if: always() && !inputs.linux_memory_diagnostic
        with:
          name: browser-essentials-linux-runtime
          path: |
            .dev-check/browser-essentials/results.json
            .dev-check/browser-essentials/*.png
            .dev-check/browser-essentials/*.log
            .dev-check/session-recovery-native/results.json
            .dev-check/session-recovery-native/*.log
            .dev-check/sync-history-native/results.json
            .dev-check/sync-history-native/*.png
            .dev-check/backup-native/results.json
            .dev-check/backup-native/*.log
          retention-days: 14

  publish-tested:
    name: Publish runtime-verified existing packages
    needs: [runtime, linux-runtime]
    if: >-
      always() && github.event_name == 'workflow_dispatch' &&
      inputs.runtime_build != '' && inputs.publish_tag != '' && !inputs.linux_build_only &&
      !inputs.runtime_memory_only && !inputs.linux_memory_diagnostic &&
      needs.runtime.result == 'success' &&
      (inputs.linux_runtime_build == '' ||
       (inputs.linux_runtime_build == inputs.runtime_build && needs['linux-runtime'].result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install cryptography
      - run: python3 tests/release_acceptance_test.py
      - name: Verify tag, Linux acceptance, signatures and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.publish_tag }}
          BUILD_RUN: ${{ inputs.runtime_build }}
          LINUX_RUNTIME_BUILD: ${{ inputs.linux_runtime_build }}
          LINUX_RUNTIME_RESULT: ${{ needs['linux-runtime'].result }}
        run: python3 tests/publish_tested_release.py
