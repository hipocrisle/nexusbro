name: Deno cache fallback diagnostic (manual, no product changes)
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  cache-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline trace scanner adversarial checks
        run: python tools/probe_deno_cache.py --self-test
      - name: Install trace tooling on disposable runner only
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v strace >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends strace
          fi
      - name: Verify exact pinned upstream Deno package
        run: python tools/package_youtube_components.py --platform linux-x64 --extractor-only
      - name: Observe unprivileged static stdin execution under three cache policies
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          python tools/probe_deno_cache.py --out .dev-check/deno-cache-probe/result.json
      - name: Preserve safe numeric and boolean observations only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deno-cache-probe-safe
          path: .dev-check/deno-cache-probe/result.json
          if-no-files-found: error
          retention-days: 7
