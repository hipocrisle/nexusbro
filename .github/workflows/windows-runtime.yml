name: Windows runtime from installer
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Build run containing nexusbro-windows installer
        required: true
        default: "43407360363"
jobs:
  runtime:
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nexusbro-windows
          path: .dev-check/package
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
      - name: Extract installer and check actual Windows screen
        shell: pwsh
        run: |
          $installer = Get-ChildItem .dev-check/package -Recurse -Filter *.exe | Select-Object -First 1
          if (-not $installer) { throw "Installer missing" }
          7z x -y $installer.FullName -o.dev-check/installed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install websocket-client Pillow
          python tests/gui/windows_render.py --exe .dev-check/installed/nexusbro.exe --cef .dev-check/installed --out .dev-check/windows-render
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save screen and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-render-verification
          path: |
            .dev-check/windows-render/*.png
            .dev-check/windows-render/*.txt
            .dev-check/windows-render/*.json
            .dev-check/windows-render/data/zhurnal.log
            .dev-check/windows-render/data/profili/*/cef*.log
          retention-days: 14
