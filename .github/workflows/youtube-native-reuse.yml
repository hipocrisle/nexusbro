name: YouTube Windows native reuse DIAGNOSTIC ONLY
on:
  workflow_call:
    inputs:
      run:
        type: string
        required: true
      source:
        type: string
        required: true
      layout_only:
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  diagnostic:
    if: ${{ !inputs.layout_only }}
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gate producer provenance and successful real Windows compilation
        id: producer
        shell: bash
        env:
          PRODUCER_RUN: ${{ inputs.run }}
          PRODUCER_SOURCE: ${{ inputs.source }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import datetime,json,os,pathlib,re,urllib.request
          run,source,repo=os.environ['PRODUCER_RUN'],os.environ['PRODUCER_SOURCE'],os.environ['GITHUB_REPOSITORY']
          def require(value,reason):
              if not value:raise SystemExit(reason)
          require(re.fullmatch(r'[1-9][0-9]{0,19}',run),'invalid_run')
          require(re.fullmatch(r'[0-9a-f]{40}',source),'invalid_source')
          require(re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+',repo),'invalid_repository')
          def api(path):
              request=urllib.request.Request('https://api.github.com/repos/'+repo+'/'+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=20) as response:
                  data=response.read(4*1024*1024+1)
              require(len(data)<=4*1024*1024,'api_bound')
              return json.loads(data)
          metadata=api('actions/runs/'+run)
          require(metadata.get('repository',{}).get('full_name')==repo and metadata.get('head_repository',{}).get('full_name')==repo,'producer_repository')
          require(metadata.get('event')=='workflow_dispatch' and metadata.get('path')=='.github/workflows/build.yml','producer_workflow')
          require(metadata.get('head_sha')==source and metadata.get('status')=='completed','producer_source_or_status')
          jobs=[]
          for page in range(1,5):
              batch=api('actions/runs/'+run+'/jobs?filter=latest&per_page=100&page='+str(page))['jobs'];jobs.extend(batch)
              if len(batch)<100:break
          else:raise SystemExit('jobs_bound')
          windows=[j for j in jobs if j.get('name')=='build (windows-latest, x86_64-pc-windows-msvc, nexusbro-windows)']
          require(len(windows)==1,'windows_job_identity')
          compiled=[s for s in windows[0].get('steps',[]) if s.get('name')=='Собрать']
          require(len(compiled)==1 and compiled[0].get('conclusion')=='success' and compiled[0].get('status')=='completed','actual_windows_compile_not_success')
          artifacts=[]
          for page in range(1,5):
              batch=api('actions/runs/'+run+'/artifacts?per_page=100&page='+str(page))['artifacts'];artifacts.extend(batch)
              if len(batch)<100:break
          else:raise SystemExit('artifacts_bound')
          chosen={}
          for name in ('nexusbro-windows','youtube-controlled-media'):
              candidates=[a for a in artifacts if a.get('name')==name and a.get('expired') is False]
              require(len(candidates)==1,'artifact_identity')
              artifact=candidates[0]
              require(artifact.get('workflow_run',{}).get('head_sha')==source,'artifact_source')
              require(type(artifact.get('id'))is int and artifact['id']>0,'artifact_id')
              if name=='nexusbro-windows':
                  require(artifact['created_at']>=compiled[0]['completed_at'],'artifact_predates_compile')
              chosen[name]=dict(id=artifact['id'],digest=artifact.get('digest'),created_at=artifact['created_at'])
          out=pathlib.Path('.dev-check/youtube-native-reuse');out.mkdir(parents=True,exist_ok=True)
          provenance=dict(diagnostic_only=True,acceptance_passed=False,current_binary=False,producer_repository=repo,
              producer_run=int(run),producer_source=source,producer_event=metadata['event'],producer_workflow=metadata['path'],
              producer_status=metadata['status'],producer_overall_conclusion=metadata.get('conclusion'),
              windows_compile_step_conclusion=compiled[0]['conclusion'],producer_windows_job_conclusion=windows[0].get('conclusion'),
              fixture_head=os.environ['GITHUB_SHA'],artifacts=chosen,generated_manifest_is_producer_not_current_fixture_build=True)
          (out/'provenance.json').write_text(json.dumps(provenance,indent=2)+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('windows_artifact='+str(chosen['nexusbro-windows']['id'])+'\nmedia_artifact='+str(chosen['youtube-controlled-media']['id'])+'\n')
          PY
      - name: Require identical tracked desktop sources without rebuilding generated seal
        shell: bash
        env:
          PRODUCER_SOURCE: ${{ inputs.source }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$PRODUCER_SOURCE"
          git diff --exit-code "$PRODUCER_SOURCE" HEAD -- desktop > .dev-check/youtube-native-reuse/desktop-diff.private
          test ! -s .dev-check/youtube-native-reuse/desktop-diff.private
          python - <<'PY'
          import json,pathlib
          path=pathlib.Path('.dev-check/youtube-native-reuse/provenance.json');data=json.loads(path.read_text());data['tracked_desktop_diff_empty']=True;path.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: Download immutable producer Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.producer.outputs.windows_artifact }}
          merge-multiple: true
          path: .dev-check/reuse-package
          run-id: ${{ inputs.run }}
          github-token: ${{ github.token }}
      - name: Download controlled media from that same producer run
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.producer.outputs.media_artifact }}
          merge-multiple: true
          path: .dev-check/reuse-media
          run-id: ${{ inputs.run }}
          github-token: ${{ github.token }}
      - name: Verify controlled media hashes before native launch
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,pathlib,re
          root=pathlib.Path('.dev-check/reuse-media');expected={}
          for line in (root/'SHA256SUMS').read_text().splitlines():
              match=re.fullmatch(r'([0-9a-f]{64}) [ *](.+)',line)
              if not match:raise SystemExit('media_hash_schema')
              name=pathlib.PurePosixPath(match[2])
              if name.is_absolute() or '..' in name.parts or '\\' in match[2] or name.name not in ('video.webm','audio.webm','video-high.webm') or name.name in expected:raise SystemExit('media_path')
              expected[name.name]=match[1]
          if not {'video.webm','audio.webm'}.issubset(expected) or len(expected)>3:raise SystemExit('media_closure')
          for name,digest in expected.items():
              path=root/name
              if path.is_symlink() or not path.is_file() or not 0<path.stat().st_size<=128*1024*1024 or hashlib.sha256(path.read_bytes()).hexdigest()!=digest:raise SystemExit('media_hash_mismatch')
          PY
      - name: Extract exactly one installer and record actual executable and manifest SHA
        id: installed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem .dev-check/reuse-package -Recurse -File -Filter *.exe)
          if ($installers.Count -ne 1) { throw 'installer_count' }
          New-Item -ItemType Directory -Force .dev-check/reuse-private | Out-Null
          & 7z x -y $installers[0].FullName '-o.dev-check/reuse-installed' *> .dev-check/reuse-private/extraction.txt
          if ($LASTEXITCODE -ne 0) { throw 'installer_extract_failed' }
          $env:REUSE_INSTALLER = $installers[0].FullName
          python -c "import hashlib,json,os,pathlib; p=pathlib.Path('.dev-check/youtube-native-reuse/provenance.json'); d=json.loads(p.read_text()); root=pathlib.Path('.dev-check/reuse-installed'); paths={'installer_sha256':pathlib.Path(os.environ['REUSE_INSTALLER']),'exe_sha256':root/'nexusbro.exe'}; d.update({k:hashlib.file_digest(v.open('rb'),'sha256').hexdigest() for k,v in paths.items()}); manifest=root/'binaries/youtube-light/components.json'; present=manifest.is_file(); d['components_manifest_present']=present; d['components_manifest_sha256']=hashlib.file_digest(manifest.open('rb'),'sha256').hexdigest() if present else None; d['download_prerequisite_present']=present; d['same_installed_app_for_both_fixtures']=True; pathlib.Path(os.environ['GITHUB_OUTPUT']).open('a').write('components_present='+str(present).lower()+'\n'); p.write_text(json.dumps(d,indent=2)+'\n')"
          if ($LASTEXITCODE -ne 0) { throw 'installed_identity_failed' }
      - name: Install existing Windows physical GUI fixture dependencies
        id: dependencies
        run: python -m pip install Pillow pyautogui pywinauto psutil websocket-client cryptography
      - name: Latest controlled player fixture on producer installer DIAGNOSTIC
        id: player
        timeout-minutes: 13
        shell: pwsh
        run: |
          python tests/gui/youtube_player_native.py --exe .dev-check/reuse-installed/nexusbro.exe --cef .dev-check/reuse-installed --out .dev-check/reuse-player --video-webm .dev-check/reuse-media/video.webm --audio-webm .dev-check/reuse-media/audio.webm *> .dev-check/reuse-private/player-console.txt
          exit $LASTEXITCODE
      - name: Latest controlled download fixture on same installer DIAGNOSTIC
        id: download
        if: always() && !cancelled() && steps.installed.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.installed.outputs.components_present == 'true'
        timeout-minutes: 12
        shell: pwsh
        run: |
          python tests/gui/youtube_download_native.py --exe .dev-check/reuse-installed/nexusbro.exe --cef .dev-check/reuse-installed --components .dev-check/reuse-installed/binaries/youtube-light --out .dev-check/reuse-download --video-webm .dev-check/reuse-media/video.webm --audio-webm .dev-check/reuse-media/audio.webm *> .dev-check/reuse-private/download-console.txt
          exit $LASTEXITCODE
      - name: Latest quality captions fullscreen fixture on same installer DIAGNOSTIC
        id: features
        if: always() && !cancelled() && steps.installed.outcome == 'success' && steps.dependencies.outcome == 'success'
        timeout-minutes: 10
        env:
          NEXUSBRO_TEST_COLD_CEF: '1'
        shell: pwsh
        run: |
          python tests/gui/youtube_features_native.py --exe .dev-check/reuse-installed/nexusbro.exe --cef .dev-check/reuse-installed --out .dev-check/reuse-features --video-webm .dev-check/reuse-media/video.webm --audio-webm .dev-check/reuse-media/audio.webm --video-high-webm .dev-check/reuse-media/video-high.webm *> .dev-check/reuse-private/features-console.txt
          exit $LASTEXITCODE
      - name: Latest strict both-clock resume fixture on same installer DIAGNOSTIC
        id: resume
        if: always() && !cancelled() && steps.installed.outcome == 'success' && steps.dependencies.outcome == 'success'
        timeout-minutes: 8
        env:
          NEXUSBRO_TEST_COLD_CEF: '1'
        shell: pwsh
        run: |
          python tests/gui/youtube_resume_native.py --exe .dev-check/reuse-installed/nexusbro.exe --cef .dev-check/reuse-installed --out .dev-check/reuse-resume --video-webm .dev-check/reuse-media/video.webm --audio-webm .dev-check/reuse-media/audio.webm *> .dev-check/reuse-private/resume-console.txt
          exit $LASTEXITCODE
      - name: Wrap sanitized receipts as diagnostics with acceptance always false
        if: always() && !cancelled()
        shell: bash
        env:
          PLAYER_OUTCOME: ${{ steps.player.outcome }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          FEATURES_OUTCOME: ${{ steps.features.outcome }}
          RESUME_OUTCOME: ${{ steps.resume.outcome }}
        run: |
          python - <<'PY'
          import json,math,os,pathlib,re
          root=pathlib.Path('.dev-check/youtube-native-reuse');root.mkdir(parents=True,exist_ok=True)
          def safe(value,key='',depth=0):
              if depth>24:return None
              if value is None or type(value)is bool:return value
              if type(value)is int:return value if abs(value)<=2**63 else None
              if type(value)is float:return value if math.isfinite(value) else None
              if isinstance(value,list):return [safe(x,key,depth+1) for x in value[:2048]]
              if isinstance(value,dict):return {k:safe(v,k,depth+1) for k,v in value.items() if isinstance(k,str) and re.fullmatch(r'[A-Za-z0-9_.-]{1,96}',k)}
              if isinstance(value,str) and (key in ('stage','state','phase','platform','reason','mode') and re.fullmatch(r'[A-Za-z0-9_. -]{0,96}',value) or key.endswith('sha256') and re.fullmatch(r'[0-9a-fA-F]{64}',value)):return value
              return 'redacted'
          for label in ('player','download','features','resume'):
              path=pathlib.Path('.dev-check/reuse-'+label+'/result.json');report=None
              if path.is_file() and path.stat().st_size<=2*1024*1024:
                  try:report=safe(json.loads(path.read_text()))
                  except (ValueError,OSError):pass
              result=dict(diagnostic_only=True,acceptance_passed=False,fixture=label,step_outcome=os.environ[label.upper()+'_OUTCOME'],receipt_present=report is not None,result=report)
              (root/('diagnostic-'+label+'.json')).write_text(json.dumps(result,indent=2)+'\n')
          path=root/'provenance.json'
          if path.is_file():
              data=json.loads(path.read_text());data.update(player_step_outcome=os.environ['PLAYER_OUTCOME'],download_step_outcome=os.environ['DOWNLOAD_OUTCOME'],features_step_outcome=os.environ['FEATURES_OUTCOME'],resume_step_outcome=os.environ['RESUME_OUTCOME'],acceptance_passed=False);path.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: Preserve JSON diagnostics only; no engine logs or URLs
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-native-reuse-diagnostic-windows
          path: |
            .dev-check/youtube-native-reuse/provenance.json
            .dev-check/youtube-native-reuse/diagnostic-player.json
            .dev-check/youtube-native-reuse/diagnostic-download.json
            .dev-check/youtube-native-reuse/diagnostic-features.json
            .dev-check/youtube-native-reuse/diagnostic-resume.json
          if-no-files-found: warn
          retention-days: 7
  linux-layout:
    name: Inspect immutable Linux package layout DIAGNOSTIC ONLY
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Gate exact same-repository producer source
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_RUN: ${{ inputs.run }}
          PRODUCER_SOURCE: ${{ inputs.source }}
        run: |
          python3 - <<'PY'
          import json,os,re,urllib.request
          run,source=os.environ['PRODUCER_RUN'],os.environ['PRODUCER_SOURCE']
          assert re.fullmatch(r'[1-9][0-9]{0,19}',run) and re.fullmatch(r'[0-9a-f]{40}',source)
          repo=os.environ['GITHUB_REPOSITORY']
          request=urllib.request.Request('https://api.github.com/repos/'+repo+'/actions/runs/'+run,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(request,timeout=20) as response:data=json.loads(response.read(1024*1024))
          assert data['head_sha']==source and data['repository']['full_name']==repo and data['head_repository']['full_name']==repo
          assert data['event']=='workflow_dispatch' and data['path']=='.github/workflows/build.yml'
          PY
      - uses: actions/download-artifact@v4
        with:
          name: nexusbro-linux
          path: .dev-check/layout-package
          run-id: ${{ inputs.run }}
          github-token: ${{ github.token }}
      - name: Inspect package members without running application
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(.dev-check/layout-package/*.deb .dev-check/layout-package/deb/*.deb)
          test "${#packages[@]}" -eq 1
          dpkg-deb --fsys-tarfile "${packages[0]}" | python3 -c 'import sys,tarfile; t=tarfile.open(fileobj=sys.stdin.buffer,mode="r|"); count=0; matches=[]
          for m in t:
           count+=1
           if count>20000:raise SystemExit("member_bound")
           if m.name.removeprefix("./").startswith("usr/bin/") or m.name.endswith(("/libcef.so","/icudtl.dat","/components.json")):matches.append({"name":m.name,"mode":oct(m.mode),"bytes":m.size,"file":m.isfile(),"link":m.issym()})
          import json; print(json.dumps({"diagnostic_only":True,"acceptance_passed":False,"members":count,"selected":matches}))'
      - name: Reproduce Linux extraction with exact stage diagnostics
        run: |
          set -euo pipefail
          shopt -s nullglob
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rpm2cpio cpio rpm libarchive-tools
          debs=(.dev-check/layout-package/*.deb .dev-check/layout-package/deb/*.deb)
          rpms=(.dev-check/layout-package/*.rpm .dev-check/layout-package/rpm/*.rpm)
          printf 'package_counts deb=%s rpm=%s\n' "${#debs[@]}" "${#rpms[@]}"
          test "${#debs[@]}" -eq 1
          test "${#rpms[@]}" -eq 1
          echo stage_deb_extract
          dpkg-deb -x "${debs[0]}" .dev-check/layout-deb
          echo stage_rpm_extract
          mkdir -p .dev-check/layout-rpm
          set +e
          rpm2cpio "${rpms[0]}" | (cd .dev-check/layout-rpm && cpio -id --quiet --no-absolute-filenames --no-preserve-owner)
          statuses=("${PIPESTATUS[@]}")
          set -e
          printf 'rpm_pipe_codes %s %s\n' "${statuses[0]}" "${statuses[1]}"
          echo stage_executable
          stat -c '%a %s %n' .dev-check/layout-deb/usr/bin/nexusbro
          test -x .dev-check/layout-deb/usr/bin/nexusbro
          echo stage_libcef
          stat -c '%a %s %n' .dev-check/layout-deb/usr/lib/NexusBro/libcef.so
          test -s .dev-check/layout-deb/usr/lib/NexusBro/libcef.so
          echo stage_rpm_digests
          rpm -K "${rpms[0]}"
          rpm -qp --qf 'name=%{NAME} version=%{VERSION} size=%{SIZE} archive_size=%{ARCHIVESIZE} long_archive_size=%{LONGARCHIVESIZE} payload=%{PAYLOADCOMPRESSOR} digest_algo=%{PAYLOADDIGESTALGO}\n' "${rpms[0]}"
          echo stage_libarchive_validation
          bsdtar -tf "${rpms[0]}" > .dev-check/layout-rpm-members.txt
          wc -l .dev-check/layout-rpm-members.txt
          echo stage_strict_libarchive_extract
          mkdir -p .dev-check/layout-rpm-verified
          bsdtar -xf "${rpms[0]}" -C .dev-check/layout-rpm-verified --no-same-owner
          python3 tools/verify_youtube_bundle.py --expected .dev-check/layout-deb/usr/lib/NexusBro/binaries/youtube-light --actual .dev-check/layout-rpm-verified/usr/lib/NexusBro/binaries/youtube-light --out .dev-check/layout-rpm-closure.json
      - name: Require identical tracked desktop before diagnostic execution
        if: ${{ !inputs.layout_only }}
        env:
          PRODUCER_SOURCE: ${{ inputs.source }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$PRODUCER_SOURCE"
          git diff --exit-code "$PRODUCER_SOURCE" HEAD -- desktop > /tmp/desktop-diff.private
          test ! -s /tmp/desktop-diff.private
      - uses: actions/download-artifact@v4
        if: ${{ !inputs.layout_only }}
        with:
          name: youtube-controlled-media
          path: .dev-check/youtube-media-fixture
          run-id: ${{ inputs.run }}
          github-token: ${{ github.token }}
      - name: Prepare installed Linux native fixtures without a desktop build
        if: ${{ !inputs.layout_only }}
        id: linux-ready
        run: |
          set -euo pipefail
          sha256sum -c .dev-check/youtube-media-fixture/SHA256SUMS
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxcb1-dev xvfb xdotool xclip x11-utils openbox libnss3-tools
          python3 -m pip install Pillow psutil websocket-client cryptography
          echo "YOUTUBE_OLD_UNPRIVILEGED_PORT_START=$(sysctl -n net.ipv4.ip_unprivileged_port_start)" >> "$GITHUB_ENV"
          sudo sysctl -w net.ipv4.ip_unprivileged_port_start=0
      - name: Linux same installed binary player DIAGNOSTIC
        if: ${{ !inputs.layout_only && steps.linux-ready.outcome == 'success' }}
        timeout-minutes: 13
        env:
          NEXUSBRO_TEST_COLD_CEF: '1'
        run: python3 tests/gui/youtube_player_native.py --exe .dev-check/layout-deb/usr/bin/nexusbro --cef .dev-check/layout-deb/usr/lib/NexusBro --out .dev-check/linux-reuse-player --video-webm .dev-check/youtube-media-fixture/video.webm --audio-webm .dev-check/youtube-media-fixture/audio.webm
      - name: Linux same installed binary download DIAGNOSTIC
        if: ${{ always() && !cancelled() && !inputs.layout_only && steps.linux-ready.outcome == 'success' }}
        timeout-minutes: 12
        env:
          NEXUSBRO_TEST_COLD_CEF: '1'
        run: python3 tests/gui/youtube_download_native.py --exe .dev-check/layout-deb/usr/bin/nexusbro --cef .dev-check/layout-deb/usr/lib/NexusBro --components .dev-check/layout-deb/usr/lib/NexusBro/binaries/youtube-light --out .dev-check/linux-reuse-download --video-webm .dev-check/youtube-media-fixture/video.webm --audio-webm .dev-check/youtube-media-fixture/audio.webm
      - name: Linux same installed binary features DIAGNOSTIC
        if: ${{ always() && !cancelled() && !inputs.layout_only && steps.linux-ready.outcome == 'success' }}
        timeout-minutes: 10
        env:
          NEXUSBRO_TEST_COLD_CEF: '1'
        run: python3 tests/gui/youtube_features_native.py --exe .dev-check/layout-deb/usr/bin/nexusbro --cef .dev-check/layout-deb/usr/lib/NexusBro --out .dev-check/linux-reuse-features --video-webm .dev-check/youtube-media-fixture/video.webm --audio-webm .dev-check/youtube-media-fixture/audio.webm --video-high-webm .dev-check/youtube-media-fixture/video-high.webm
      - name: Linux same installed binary strict resume DIAGNOSTIC
        if: ${{ always() && !cancelled() && !inputs.layout_only && steps.linux-ready.outcome == 'success' }}
        timeout-minutes: 8
        env:
          NEXUSBRO_TEST_COLD_CEF: '1'
        run: python3 tests/gui/youtube_resume_native.py --exe .dev-check/layout-deb/usr/bin/nexusbro --cef .dev-check/layout-deb/usr/lib/NexusBro --out .dev-check/linux-reuse-resume --video-webm .dev-check/youtube-media-fixture/video.webm --audio-webm .dev-check/youtube-media-fixture/audio.webm
      - name: Restore disposable Linux witness permission
        if: ${{ always() && env.YOUTUBE_OLD_UNPRIVILEGED_PORT_START != '' }}
        run: sudo sysctl -w "net.ipv4.ip_unprivileged_port_start=$YOUTUBE_OLD_UNPRIVILEGED_PORT_START"
      - name: Mark same-binary results as diagnostics, never release acceptance
        if: ${{ always() && !inputs.layout_only }}
        run: |
          python3 - <<'PY'
          import json,pathlib
          for label in ('player','download','features','resume'):
              path=pathlib.Path('.dev-check/linux-reuse-'+label+'/result.json')
              if path.is_file() and path.stat().st_size<=2*1024*1024:
                  data=json.loads(path.read_text());data.update(diagnostic_only=True,acceptance_passed=False,current_binary=False)
                  path.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ always() && !inputs.layout_only }}
        with:
          name: youtube-native-reuse-diagnostic-linux
          path: |
            .dev-check/linux-reuse-player/result.json
            .dev-check/linux-reuse-download/result.json
            .dev-check/linux-reuse-features/result.json
            .dev-check/linux-reuse-resume/result.json
