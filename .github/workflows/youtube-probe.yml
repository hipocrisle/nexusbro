name: YouTube anonymous component probe
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  extract:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
            probe: tests/youtube_light_harness/target/release/external_probe
          - os: windows-latest
            platform: windows-x64
            probe: tests/youtube_light_harness/target/release/external_probe.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install probe observation dependency
        run: python -m pip install psutil
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify and package exact upstream components
        run: python tools/package_youtube_components.py --platform ${{ matrix.platform }} --extractor-only
      - name: Compile production extractor and parser probe (no desktop build)
        run: cargo build --release --manifest-path tests/youtube_light_harness/Cargo.toml --bin external_probe
      - name: Real anonymous extraction through witnessed local transport
        run: python tests/gui/youtube_extract_external.py --probe-exe "${{ matrix.probe }}" --components desktop/src-tauri/binaries/youtube-light --out .dev-check/youtube-extract-external/result.json
      - name: Preserve sanitized receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-extract-${{ matrix.platform }}
          path: .dev-check/youtube-extract-external/result.json
          if-no-files-found: warn
