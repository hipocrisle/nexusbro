[package]
name = "nexusbro-youtube-light-verification"
version = "0.1.0"
edition = "2021"
publish = false
[workspace]
[features]
default = []
encrypted-diagnostics = ["dep:rsa", "dep:base64", "dep:chacha20poly1305"]
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "process", "sync"] }
zeroize = "1.8"
rsa = { version = "0.9", optional = true }
sha2 = "0.10"
base64 = { version = "0.22", optional = true }
chacha20poly1305 = { version = "0.10", optional = true }

rand_core = { version = "0.6", features = ["getrandom"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
