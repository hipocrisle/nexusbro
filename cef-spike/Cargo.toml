[package]
name = "cef-spike"
version = "0.1.0"
edition = "2021"
publish = false

# Спайк: CEF внутри нашего окна + трафик через наш прокси.
# Доказать должно: (1) движок рендерится ВНУТРИ окна (set_as_child —
#   официальный режим CEF, никаких чужих окон и сторожа),
#   (2) --proxy-server работает и весь трафик идёт через наш адрес,
#   (3) окно одно, в Alt+Tab одна запись, кнопки/рамки движка нет.

[dependencies]
cef = { version = "156.4", default-features = false }
winit = "0.29"
